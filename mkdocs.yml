site_name: Trano
site_url: https://andoludo.github.io/trano/
site_description: >-
  Trano generates Modelica building energy simulation models (Buildings, IDEAS, AixLib,
  FastSmoothBuildings) from YAML, JSON or RDF, validated against ASHRAE 140 BESTEST, for
  OpenModelica, Dymola and model predictive control.
site_author: Ando Andriamamonjy
copyright: Copyright &copy; Ando Andriamamonjy, Apache-2.0
repo_name: andoludo/trano
repo_url: https://github.com/andoludo/trano
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/lightbulb-auto
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference

  features:
  - content.code.annotate
  - content.code.copy
  # - content.code.select
  - content.footnote.tooltips
  - content.tabs.link
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.instant.prefetch
  # - navigation.instant.preview
  - navigation.instant.progress
  - navigation.path
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.share
  - search.suggest
  - toc.follow

  icon:
    repo: fontawesome/brands/github-alt
  logo: img/trano.webp
  favicon: img/trano.webp
  language: en
# Placeholder sections without content yet: kept in the repository, left out of the built site.
exclude_docs: |
  explanation/
  how-to guides/
plugins:
  - search
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/andoludo/trano
      name: Trano on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/trano/
      name: Trano on PyPI
nav:
  - Trano: index.md
  - Getting-started:
    - Installation: getting-started/installation.md
  - Tutorials:
    - First model and simulation: tutorials/first_model_and_simulation.md
    - Model with another library: tutorials/model_with_another_library.md
    - Multi-zones: tutorials/multizone_model.md
    - Multi-zone with ideal heating: tutorials/multi-zone_with_ideal_heating.md
    - Multi-zone with hydronic heating: tutorials/multi-zone_with_hydronic_heating.md
    - Hydronic heating with mixing circuits: tutorials/hydronic_mixing_circuits.md
    - Zone with ventilation: tutorials/zone_with_ventilation.md
    - Model with photovoltaics: tutorials/zone_with_photovoltaics.md
    - A house before and after renovation: tutorials/residential_renovation.md
    - FastSmoothBuildings, models close to Buildings in closed loop and for MPC: tutorials/fast_smooth_buildings.md
    - Component variants: tutorials/component_variants.md
  - Reference:
      - Components: reference/components.md
      - Parameters: reference/parameters.md
      - FastSmoothBuildings: reference/fast_smooth_buildings.md
  - Validation:
      - ASHRAE 140 (BESTEST): validation/bestest.md
      - Systems (heat pumps, boilers, valves, ventilation): validation/systems.md
      - A walk through the BESTEST cases: validation/bestest_cases.md
      - Residential reference cases: validation/residential_reference_cases.md
      - FastSmoothBuildings against Buildings: https://andoludo.github.io/FastSmoothBuildings/validation/study/
      - Simulation performance: validation/simulation_performance.md

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - markdown_include.include:
        base_path: docs
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.arithmatex:
        generic: true
    - pymdownx.snippets
    - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
