PhotovoltaicParameters:
  description: Parameters of photovoltaic panels
  attributes:
    area:
      description: Module area [m2]
      ifabsent: float(20.0)
      range: float
      minimum_value: 0
      positive: true
      alias: A
    efficiency:
      description: Module and inverter efficiency [1]
      ifabsent: float(0.18)
      range: float
      minimum_value: 0
      maximum_value: 1
      alias: eta
    azimuth:
      description: Surface azimuth [deg], 0 for south, 90 for west
      ifabsent: float(0.0)
      range: float
      minimum_value: -360
      maximum_value: 360
      render: false
    tilt:
      description: Surface tilt [deg], 0 for a roof, 90 for a wall
      ifabsent: float(35.0)
      range: float
      minimum_value: 0
      maximum_value: 90
      render: false
    active_area_fraction:
      alias: fAct
      description: Share of the module area covered by active cells [1], 0.9 by default
      range: float
      minimum_value: 0
      maximum_value: 1
    inverter_efficiency:
      alias: eta_DCAC
      description: Efficiency of the DC to AC conversion [1], 0.9 by default
      range: float
      minimum_value: 0
      maximum_value: 1
    power_factor:
      alias: pf
      description: Power factor of the inverter [1], 0.9 by default
      range: float
      minimum_value: 0
      maximum_value: 1
    tilt_radians:
      alias: til
      description: Surface tilt [rad], from the tilt in degrees
      func: 'lambda self: round(self.tilt * 3.141592653589793 / 180, 6)'
      type: float
    azimuth_radians:
      alias: azi
      description: Surface azimuth [rad], from the azimuth in degrees
      func: 'lambda self: round(self.azimuth * 3.141592653589793 / 180, 6)'
      type: float
  classes:
  - Photovoltaic
SensorParameters:
  description: Parameters of a water temperature sensor or heat meter
  attributes:
    nominal_mass_flow_rate:
      alias: m_flow_nominal
      description: Nominal mass flow rate through the sensor, used for its dynamics and its small-flow regularization [kg/s]
      ifabsent: float(0.15)
      range: float
      minimum_value: 0
      positive: true
    time_constant:
      alias: tau
      description: Time constant of the sensor [s], 1 by default; 0 for an ideal sensor
      range: float
      minimum_value: 0
  classes:
  - TemperatureSensor
  - HeatMeterSensor
