BoilerControlParameters:
  attributes:
    threshold_outdoor_air_cutoff:
      alias: threshold_outdoor_air_cutoff
      description: Outdoor air temperature threshold; output is true when the outdoor air is below this heating cut-off limit [K]
      ifabsent: float(288.15)
      range: float
    threshold_to_switch_off_boiler:
      alias: threshold_to_switch_off_boiler
      description: Tank bottom temperature above which the boiler switches off; defaults to tsup_nominal + 5 K [K]
      range: float
    tsup_nominal:
      alias: TSup_nominal
      description: Supply temperature set point; the boiler starts when the tank top drops 1 K below it [K]
      ifabsent: float(353.15)
      range: float
  classes:
  - BoilerControl
BoilerParameters:
  attributes:
    coefficients_for_efficiency_curve:
      alias: a
      description: Coefficients for efficiency curve
      ifabsent: string({0.9})
      range: string
    diff_pressure:
      alias: dp
      description: Pressure rise values defining the boiler-circuit pump pressure curve [Pa]
      ifabsent: string(5000*{2,1})
      range: string
    dp_nominal:
      alias: dp_nominal
      description: Pressure difference [Pa]
      ifabsent: float(5000)
      range: float
    dt_boi_nominal:
      alias: dTBoi_nominal
      description: Nominal temperature difference for the boiler loop [K]
      ifabsent: float(20)
      range: float
      render: false
    dt_rad_nominal:
      alias: dTRad_nominal
      description: Nominal temperature difference for the radiator loop [K]
      ifabsent: float(10)
      range: float
      render: false
    effcur:
      alias: effCur
      description: Curve used to compute the efficiency
      ifabsent: string(Buildings.Fluid.Types.EfficiencyCurves.Constant)
      range: string
    fraction_of_nominal_flow_rate_where_flow_transitions_to_laminar:
      alias: deltaM
      description: Fraction of nominal flow rate where flow transitions to laminar [1]
      ifabsent: float(0.1)
      range: float
      numerical: true
    height_of_tank_without_insulation:
      alias: hTan
      description: Height of tank (without insulation) [m]
      ifabsent: float(2)
      range: float
    if_actual_temperature_at_port_is_computed:
      alias: show_T
      description: = true, if actual temperature at port is computed
      ifabsent: string(false)
      range: string
      numerical: true
    nominal_heating_power:
      alias: Q_flow_nominal
      description: Nominal heating power [W]
      ifabsent: float(20000)
      range: float
    nominal_mass_flow_radiator_loop:
      alias: null
      description: Nominal mass flow rate of the radiator loop [kg/s]
      func: 'lambda self: self.sca_fac_rad * self.nominal_heating_power / self.dt_rad_nominal
        / 4200'
      type: float
    nominal_mass_flow_rate_boiler:
      alias: null
      description: Nominal mass flow rate of the boiler loop [kg/s]
      func: 'lambda self: self.sca_fac_rad * self.nominal_heating_power / self.dt_boi_nominal
        / 4200'
      type: float
    number_of_volume_segments:
      alias: nSeg
      description: Number of volume segments [1]
      ifabsent: int(4)
      range: integer
      numerical: true
    sca_fac_rad:
      alias: scaFacRad
      description: Scaling factor to scale the power (and mass flow rate) of the radiator loop [1]
      ifabsent: float(1.5)
      range: float
      render: false
    tank_volume:
      alias: VTan
      description: Tank volume [m3]
      ifabsent: float(0.2)
      range: float
    temperature_used_to_compute_nominal_efficiency:
      alias: T_nominal
      description: Temperature used to compute nominal efficiency (only used if efficiency curve depends on temperature) [K]
      ifabsent: float(353.15)
      range: float
    thickness_of_insulation:
      alias: dIns
      description: Thickness of insulation [m]
      ifabsent: float(0.1)
      range: float
    use_linear_relation_between_m_flow_and_dp_for_any_flow_rate:
      alias: linearizeFlowResistance
      description: = true, use linear relation between m_flow and dp for any flow rate
      ifabsent: string(true)
      range: string
      numerical: true
    v_flow:
      alias: V_flow
      description: Volume flow rate values defining the boiler-circuit pump pressure curve [m3/s]
      func: 'lambda self: f''{self.nominal_mass_flow_rate_boiler}'' ''/1000*{0.5,1}'''
      type: str
    use_storage_tank:
      alias: useStorageTank
      description: None
      ifabsent: string(false)
      range: string
    temperature_heatpump_source:
      alias: TSouSet
      description: None
      ifabsent: float(286.15)
      range: float
    temperature_supply_setpoint_heat_pump:
      alias: TSet
      description: None
      ifabsent: float(323.15)
      range: float
    cop_nominal:
      description: Heat pump COP at the rating point A7/W35, used by the mpc library [1]
      ifabsent: float(4.5)
      range: float
      render: false
    cop_outdoor_slope:
      description: Heat pump COP change per kelvin of outdoor temperature, mpc library [1/K]
      ifabsent: float(0.11)
      range: float
      render: false
    cop_supply_slope:
      description: Heat pump COP change per kelvin of supply temperature, mpc library [1/K]
      ifabsent: float(-0.075)
      range: float
      render: false
    cop_cross_term:
      description: Heat pump COP cross term outdoor x supply deviation, mpc library [1/K2]
      ifabsent: float(-0.0025)
      range: float
      render: false
    max_electrical_power:
      description: Maximum electrical power of the heat pump compressor, mpc library [W] (nominal heating power / COP when absent)
      ifabsent: float(None)
      range: float
      render: false
  classes:
  - Boiler
ControlLoopsParameters:
  attributes:
    dt_hys:
      alias: dTHys
      description: Delta between the temperature hysteresis high and low limit [K]
      ifabsent: float(0.25)
      range: float
    k_coo_con:
      alias: kCooCon
      description: Gain of controller for cooling control loop [1]
      ifabsent: float(0.1)
      range: float
    k_hea_con:
      alias: kHeaCon
      description: Gain of controller for heating control loop [1]
      ifabsent: float(0.1)
      range: float
    loo_hys:
      alias: looHys
      description: Threshold value to check if the controller output is near zero [1]
      ifabsent: float(0.01)
      range: float
    ti_coo_con:
      alias: TiCooCon
      description: Time constant of integrator block for cooling control loop [s]
      ifabsent: float(900)
      range: float
    ti_hea_con:
      alias: TiHeaCon
      description: Time constant of integrator block for heating control loop [s]
      ifabsent: float(900)
      range: float
    tim_che:
      alias: timChe
      description: Threshold time to check the zone temperature status [s]
      ifabsent: float(30)
      range: float
  classes:

EmissionControlParameters:
  attributes:
    schedule:
      alias: schedule
      description: Schedule of switching times that toggles the heating set point between the occupied set point and the setback value
      ifabsent: string(3600*{7, 19})
      range: string
    temperature_heating_setpoint:
      alias: THeaSet
      description: Room air temperature heating set point during occupied period [K]
      ifabsent: float(297)
      range: float
    temperature_heating_setback:
      alias: THeaSetBack
      description: Room air temperature heating set point during the setback period (e.g. at night) [K]
      ifabsent: float(289)
      range: float
    controller_gain:
      alias: k
      description: Gain of controller [1]
      ifabsent: float(5)
      range: float
    data:
      alias: data
      description: Occupancy data sources
      range: DataSource
      multivalued: true
      inlined: true
      inlined_as_list: true
  classes:
  - EmissionControl
OccupancyParameters:
  attributes:
    gain:
      alias: gain
      description: Gain to convert from occupancy (per person) to radiant, convective and latent heat in [W/m2]
      ifabsent: string([35; 70; 30])
      range: string
      default_from: >-
        f"[{self.sensible_heat_per_person * (0.5 if self.radiant_fraction is None else self.radiant_fraction):g};
        {self.sensible_heat_per_person * (1 - (0.5 if self.radiant_fraction is None else self.radiant_fraction)):g};
        {self.latent_heat_per_person or 0:g}]" if self.sensible_heat_per_person is not None else None
    heat_gain_if_occupied:
      alias: k
      description: Heat gain if occupied
      ifabsent: string(1/6/4)
      range: string
      short_name: occupant_density
    occupancy:
      alias: occupancy
      description: Occupancy table, each entry switching occupancy on or off
      ifabsent: string(3600*{7, 19})
      range: string
    ach:
      alias: ACH
      description: Infiltration [1/h]
      ifabsent: float(0.9)
      range: float
      deprecated: the infiltration of a zone is the `ach` parameter of its space
    floor_area:
      alias: AFlo
      description: Floor area [m2]
      range: float
      libraries:
        buildings: {name: AFlo, variants: [co2]}
        ideas: {name: AFlo, variants: [co2]}
        reduced_order: null
        iso_13790: null
        mpc: null
    data:
      alias: data
      description: Occupancy data sources
      range: DataSource
      multivalued: true
      inlined: true
      inlined_as_list: true
    sensible_heat_per_person:
      description: Sensible heat released per occupant [W]; with the latent heat and the radiant fraction it gives the `gain` matrix when that one is absent
      range: float
      libraries:
        buildings: {handled: true}
        ideas: {handled: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
        mpc: {handled: true}
    latent_heat_per_person:
      description: Latent heat released per occupant [W]
      range: float
      libraries:
        buildings: {handled: true}
        ideas: {handled: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
        mpc: {handled: true}
    radiant_fraction:
      description: Radiant share of the sensible heat of the occupants [1]
      range: float
      libraries:
        buildings: {handled: true}
        ideas: {handled: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
        mpc: {handled: true}
    lighting_power_density:
      alias: lightingPower
      description: Heat released by the lighting per floor area, all day [W/m2]
      range: float
      libraries:
        ideas: null
        reduced_order: {handled: true}
        mpc: null
    lighting_radiant_fraction:
      alias: lightingRadiantFraction
      description: Radiant share of the lighting heat [1], 0.4 by default
      range: float
      libraries:
        ideas: null
        reduced_order: {handled: true}
        mpc: null
    equipment_power_density:
      alias: equipmentPower
      description: Heat released by the equipment per floor area, all day [W/m2]
      range: float
      libraries:
        ideas: null
        reduced_order: {handled: true}
        mpc: null
    equipment_radiant_fraction:
      alias: equipmentRadiantFraction
      description: Radiant share of the equipment heat [1], 0.4 by default
      range: float
      libraries:
        ideas: null
        reduced_order: {handled: true}
        mpc: null
    activity_degree:
      alias: activityDegree
      description: Activity level of the occupants of the reduced-order zone [met], 1.2 by default
      range: float
      libraries:
        buildings: null
        ideas: null
        reduced_order: {handled: true}
        iso_13790: null
        mpc: null
    co2_generation_per_person:
      alias: gCO2
      description: CO2 released per occupant [m3/s], 5.2e-6 by default (CO2 variant)
      range: float
      libraries:
        buildings: {name: gCO2, variants: [co2]}
        ideas: {name: gCO2, variants: [co2]}
        reduced_order: null
        iso_13790: null
        mpc: null
    outdoor_co2_concentration:
      alias: ppmOut
      description: CO2 concentration of the outdoor air [ppm], 420 by default (CO2 variant)
      range: float
      libraries:
        buildings: {name: ppmOut, variants: [co2]}
        ideas: {name: ppmOut, variants: [co2]}
        reduced_order: null
        iso_13790: null
        mpc: null
  classes:
  - Occupancy
PIDParameters:
  attributes:
    controller_type:
      alias: controllerType
      description: Type of controller
      ifabsent: string(Buildings.Controls.OBC.CDL.Types.SimpleController.P)
      range: string
    k:
      alias: k
      description: Gain of controller [1]
      ifabsent: float(1)
      range: float
    nd:
      alias: Nd
      description: The higher Nd, the more ideal the derivative block [1]
      ifabsent: float(10)
      range: float
    ni:
      alias: Ni
      description: Ni*Ti is time constant of anti-windup compensation [1]
      ifabsent: float(0.9)
      range: float
    r:
      alias: r
      description: Typical range of control error, used for scaling the control error
      ifabsent: float(1)
      range: float
    td:
      alias: Td
      description: Time constant of derivative block [s]
      ifabsent: float(0.1)
      range: float
    ti:
      alias: Ti
      description: Time constant of integrator block [s]
      ifabsent: float(0.5)
      range: float
    y_max:
      alias: yMax
      description: Upper limit of output [1]
      ifabsent: float(1)
      range: float
    y_min:
      alias: yMin
      description: Lower limit of output [1]
      ifabsent: float(0)
      range: float
  classes:
  - ThreeWayValveControl
  - CollectorControl
PumpParameters:
  attributes:
    constant_input_set_point:
      alias: constInput
      description: Constant input set point
      range: float
      render: false
      deprecated: it never reached the pump model and has no effect
    dp_nominal:
      alias: dp_nominal
      description: Nominal pressure raise [Pa]
      ifabsent: float(30000)
      range: float
    m_flow_nominal:
      alias: m_flow_nominal
      description: Nominal mass flow rate [kg/s]
      ifabsent: float(0.15)
      range: float

  classes:
  - Pump
IdealHeatingCoolingParameter:
  attributes:
    controller_gain:
      alias: k
      description: Gain of the heating and cooling PI controllers, output fraction of the capacity per kelvin of error [1/K]
      ifabsent: float(0.1)
      range: float
    controller_integral_time:
      alias: Ti
      description: Integral time of the heating and cooling PI controllers [s]
      ifabsent: float(300)
      range: float
    cooling_setpoint_schedule:
      alias: TSetCoo
      description: Day schedule of the cooling set point, rows of time since midnight [s] and set point [K], repeated every day; one row for a constant set point
      ifabsent: string([0, 300.15])
      range: string
    heating_setpoint_schedule:
      alias: TSetHea
      description: Day schedule of the heating set point, rows of time since midnight [s] and set point [K], repeated every day; one row for a constant set point
      ifabsent: string([0, 293.15])
      range: string
    maximum_cooling_power:
      alias: QCoo_flow_max
      description: Cooling capacity; zero switches cooling off [W]
      ifabsent: float(1000000)
      range: float
    maximum_heating_power:
      alias: QHea_flow_max
      description: Heating capacity; zero switches heating off [W]
      ifabsent: float(1000000)
      range: float
    radiative_fraction:
      alias: frad
      description: Fraction of the heat flow exchanged with the radiative temperature of the zone, the rest with its air [1]
      ifabsent: float(0)
      range: float
  classes:
  - IdealHeatingCooling
RadiatorParameter:
  attributes:
    air_temperature_at_nominal_condition:
      alias: TAir_nominal
      description: Air temperature at nominal condition [K]
      ifabsent: float(293.15)
      range: float
    dp_nominal:
      alias: dp_nominal
      description: Pressure drop at nominal mass flow rate [Pa]
      ifabsent: float(2000)
      range: float
    dry_mass_of_radiator_that_will_be_lumped_to_water_heat_capacity:
      alias: mDry
      description: Dry mass of radiator that will be lumped to water heat capacity [kg]
      func: 'lambda self: 0.0263 * abs(self.nominal_heating_power_positive_for_heating)'
      type: float
    exponent_for_heat_transfer:
      alias: n
      description: Exponent for heat transfer
      ifabsent: float(1.24)
      range: float
    fraction_of_nominal_mass_flow_rate_where_transition_to_turbulent_occurs:
      alias: deltaM
      description: Fraction of nominal mass flow rate where transition to turbulent occurs [1]
      ifabsent: float(0.01)
      range: float
      numerical: true
    fraction_radiant_heat_transfer:
      alias: fraRad
      description: Fraction radiant heat transfer [1]
      ifabsent: float(0.3)
      range: float
    nominal_heating_power_positive_for_heating:
      alias: Q_flow_nominal
      description: Nominal heating power (positive for heating) [W]
      ifabsent: float(5000)
      range: float
    number_of_elements_used_in_the_discretization:
      alias: nEle
      description: Number of elements used in the discretization [1]
      ifabsent: int(1)
      range: integer
      numerical: true
    radiative_temperature_at_nominal_condition:
      alias: TRad_nominal
      description: Radiative temperature at nominal condition [K]
      ifabsent: float(293.15)
      range: float
    use_linear_relation_between_m_flow_and_dp_for_any_flow_rate:
      alias: linearized
      description: = true, use linear relation between m_flow and dp for any flow rate
      ifabsent: string(true)
      range: string
      numerical: true
    use_m_flow_f_dp_else_dp_f_m_flow:
      alias: from_dp
      description: = true, use m_flow = f(dp) else dp = f(m_flow)
      ifabsent: string(false)
      range: string
      numerical: true
    water_inlet_temperature_at_nominal_condition:
      alias: T_a_nominal
      description: Water inlet temperature at nominal condition [K]
      ifabsent: float(353.15)
      range: float
    water_outlet_temperature_at_nominal_condition:
      alias: T_b_nominal
      description: Water outlet temperature at nominal condition [K]
      ifabsent: float(333.15)
      range: float
    water_volume_of_radiator:
      alias: VWat
      description: Water volume of radiator [m3]
      func: lambda self:5.8e-6 * abs(self.nominal_heating_power_positive_for_heating)
      type: float
  classes:
  - Radiator
SpaceParameter:
  attributes:
    average_room_height:
      alias: hRoo
      description: Average room height [m]
      ifabsent: float(2)
      range: float
      libraries:
        ideas: hZone
        reduced_order: null
        iso_13790: null
    floor_area:
      alias: AFlo
      description: Floor area [m2]
      ifabsent: float(20)
      range: float
      libraries:
        ideas: {handled: true}
        reduced_order: AZone
        iso_13790: AFlo
    linearize_emissive_power:
      alias: linearizeRadiation
      description: Set to true to linearize emissive power
      ifabsent: string(true)
      range: string
      numerical: true
      libraries:
        ideas: null
        reduced_order: null
        iso_13790: null
    nominal_mass_flow_rate:
      alias: m_flow_nominal
      description: Nominal mass flow rate [kg/s]
      ifabsent: float(0.01)
      range: float
      libraries:
        ideas: {name: m_flow_nominal, when_given: true}
        reduced_order: null
        iso_13790: null
    sensible_thermal_mass_scaling_factor:
      alias: mSenFac
      description: Factor for scaling the sensible thermal mass of the zone air volume [1]
      ifabsent: float(1)
      range: float
      libraries:
        reduced_order: {name: mSenFac, when_given: true}
        iso_13790: null
    ach:
      alias: ACH
      description: Infiltration [1/h]
      range: float
      default_from: self.n50 / self.n50_to_ach if self.n50 is not None else None
      libraries:
        buildings: {name: ACH, variants: [infiltration]}
        ideas: {handled: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
    ventilation_schedule:
      alias: ventilationSchedule
      description: Day schedule of outdoor air brought into the zone on top of the infiltration, rows of time since midnight [s] and mass flow rate [kg/s], repeated every day (Buildings infiltration variant)
      range: string
      libraries:
        buildings: {name: ventilationSchedule, variants: [infiltration]}
        ideas: {handled: true}
        reduced_order: null
        iso_13790: null
    temperature_initial:
      alias: T_start
      description: Initial temperature [K]
      ifabsent: float(294.15)
      range: float
      libraries:
        reduced_order: {name: T_start, when_given: true}
        iso_13790: null
    volume:
      alias: null
      description: Air volume of the zone [m3]
      func: lambda self:self.floor_area * self.average_room_height
      type: float
      libraries:
        buildings: null
        ideas: V
        reduced_order: VAir
        iso_13790: VRoo
    n50:
      description: Air change rate at a 50 Pa pressure difference, the airtightness of the zone [1/h]; gives the infiltration `ach` as n50 / n50_to_ach when `ach` is absent (IDEAS takes it directly)
      range: float
      libraries:
        buildings: {handled: true}
        ideas: {handled: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
    n50_to_ach:
      alias: n50toAch
      description: Ratio between the air change rate at 50 Pa and the infiltration rate [1]
      ifabsent: float(20)
      range: float
      libraries:
        buildings: {handled: true}
        ideas: {name: n50toAch, when_given: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
    interior_convection_coefficient:
      alias: hIntFixed
      description: Fixed convective heat transfer coefficient of the inside surfaces [W/(m2.K)]; Buildings and the ISO 13790 zone switch to a fixed coefficient (3 and 3.45 by default), the reduced-order zone applies it to its walls, windows, floor and roof (2.7 by default)
      range: float
      libraries:
        ideas: null
        reduced_order: {handled: true}
        iso_13790: hInt
    exterior_convection_coefficient:
      alias: hExtFixed
      description: Fixed convective heat transfer coefficient of the outside surfaces [W/(m2.K)]; Buildings switches to a fixed coefficient (10 by default), the reduced-order zone applies it to its walls, windows and roof (20 by default)
      range: float
      libraries:
        ideas: null
        reduced_order: {handled: true}
        iso_13790: null
    thermal_mass_class:
      description: Building mass class of the ISO 13790 zone, light, medium or heavy; derived from the heat capacity of the constructions when absent
      range: string
      libraries:
        buildings: null
        ideas: null
        reduced_order: null
        iso_13790: {handled: true}
    ground_heat_transfer_factor:
      alias: b
      description: Adjustment factor of the heat transfer through the floor to the ground of the ISO 13790 zone [1], 0.5 by default
      range: float
      libraries:
        buildings: null
        ideas: null
        reduced_order: null
    shading_reduction_factor:
      alias: shaRedFac
      description: Factor on the solar gains through the windows for external shading [1]; the ISO 13790 zone applies it always (1 by default), the reduced-order zone when the irradiance exceeds the sunblind threshold (0.7 by default)
      range: float
      libraries:
        buildings: null
        ideas: null
        reduced_order: {handled: true}
    sunblind_irradiance_threshold:
      alias: maxIrr
      description: Irradiance on a window above which the reduced-order zone applies the shading reduction factor [W/m2], 100 by default
      range: float
      libraries:
        buildings: null
        ideas: null
        reduced_order: {handled: true}
        iso_13790: null
  classes:
  - Space
SplitValveParameters:
  attributes:
    dp_nominal:
      alias: dp_nominal
      description: Pressure drop at nominal mass flow rate, set to zero or negative number at outflowing ports [Pa]
      ifabsent: string({5000,-1,-1})
      range: string
    fraction_of_nominal_mass_flow_rate_where_transition_to_turbulent_occurs:
      alias: deltaM
      description: Fraction of nominal mass flow rate where transition to turbulent occurs [1]
      ifabsent: float(0.3)
      range: float
      numerical: true
    m_flow_nominal:
      alias: None
      description: Mass flow rate; set negative at outflowing ports [kg/s]
      ifabsent: string(0.15*{1,-1,-1})
      range: string
    nominal_mass_flow_rate_for_dynamic_momentum_and_energy_balance:
      alias: mDyn_flow_nominal
      description: Nominal mass flow rate for dynamic momentum and energy balance [kg/s]
      range: float
      numerical: true
