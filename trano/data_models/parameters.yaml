BoilerControlParameters:
  description: Parameters of the control of a boiler or heat pump
  attributes:
    threshold_outdoor_air_cutoff:
      alias: threshold_outdoor_air_cutoff
      description: Outdoor air temperature threshold; output is true when the outdoor air is below this heating cut-off limit [K]
      ifabsent: float(288.15)
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
    threshold_to_switch_off_boiler:
      alias: threshold_to_switch_off_boiler
      description: Tank bottom temperature above which the boiler switches off; defaults to tsup_nominal + 5 K [K]
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
    tsup_nominal:
      alias: TSup_nominal
      description: Supply temperature set point; the boiler starts when the tank top drops 1 K below it [K]
      ifabsent: float(353.15)
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
    temperature_hysteresis:
      alias: dTHys
      description: Hysteresis of the tank temperature checks that start and stop the boiler (default and complex
        variants; the simple variant has no such checks); 0 (the default) switches at each threshold crossing,
        about 1 K avoids their chattering (see the simulation performance page) [K]
      range: float
      minimum_value: 0
      maximum_value: 10
  classes:
  - BoilerControl
BoilerParameters:
  description: Parameters of a boiler or heat pump and of its storage tank
  attributes:
    coefficients_for_efficiency_curve:
      alias: a
      description: Coefficients for efficiency curve
      ifabsent: string({0.9})
      range: string
      short_name: efficiency_curve_coefficients
    diff_pressure:
      alias: dp
      description: Pressure rise values defining the boiler-circuit pump pressure curve [Pa]
      ifabsent: string(5000*{2,1})
      range: string
    dp_nominal:
      alias: dp_nominal
      description: Pressure difference [Pa]
      ifabsent: float(5000)
      range: float
      minimum_value: 0
    dt_boi_nominal:
      alias: dTBoi_nominal
      description: Nominal temperature difference for the boiler loop [K]
      ifabsent: float(20)
      range: float
      minimum_value: 0
      positive: true
      render: false
    dt_rad_nominal:
      alias: dTRad_nominal
      description: Nominal temperature difference for the radiator loop [K]
      ifabsent: float(10)
      range: float
      minimum_value: 0
      positive: true
      render: false
    effcur:
      alias: effCur
      description: Curve used to compute the efficiency
      ifabsent: string(Buildings.Fluid.Types.EfficiencyCurves.Constant)
      range: string
      short_name: efficiency_curve
    fraction_of_nominal_flow_rate_where_flow_transitions_to_laminar:
      alias: deltaM
      description: Fraction of nominal flow rate where flow transitions to laminar [1]
      ifabsent: float(0.1)
      range: float
      minimum_value: 0
      maximum_value: 1
      short_name: laminar_transition_fraction
      numerical: true
    height_of_tank_without_insulation:
      alias: hTan
      description: Height of tank (without insulation) [m]
      ifabsent: float(2)
      range: float
      minimum_value: 0
      positive: true
      short_name: tank_height
    if_actual_temperature_at_port_is_computed:
      alias: show_T
      description: = true, if actual temperature at port is computed
      ifabsent: string(false)
      range: string
      short_name: show_temperature
      numerical: true
    nominal_heating_power:
      alias: Q_flow_nominal
      description: Nominal heating power [W]
      ifabsent: float(20000)
      range: float
      minimum_value: 0
      positive: true
    nominal_mass_flow_radiator_loop:
      alias: null
      description: Nominal mass flow rate of the radiator loop [kg/s]
      func: 'lambda self: self.sca_fac_rad * self.nominal_heating_power / self.dt_rad_nominal
        / 4200'
      type: float
    nominal_mass_flow_rate_boiler:
      alias: null
      description: Nominal mass flow rate of the boiler loop [kg/s]
      func: 'lambda self: self.sca_fac_rad * self.nominal_heating_power / self.dt_boi_nominal
        / 4200'
      type: float
    number_of_volume_segments:
      alias: nSeg
      description: Number of volume segments [1]
      ifabsent: int(4)
      range: integer
      minimum_value: 1
      numerical: true
    sca_fac_rad:
      alias: scaFacRad
      description: Scaling factor to scale the power (and mass flow rate) of the radiator loop [1]
      ifabsent: float(1.5)
      range: float
      minimum_value: 0
      positive: true
      render: false
    tank_volume:
      alias: VTan
      description: Tank volume [m3]
      ifabsent: float(0.2)
      range: float
      minimum_value: 0
      positive: true
    temperature_used_to_compute_nominal_efficiency:
      alias: T_nominal
      description: Temperature used to compute nominal efficiency (only used if efficiency curve depends on temperature) [K]
      ifabsent: float(353.15)
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
      short_name: nominal_efficiency_temperature
    thickness_of_insulation:
      alias: dIns
      description: Thickness of insulation [m]
      ifabsent: float(0.1)
      range: float
      minimum_value: 0
      short_name: insulation_thickness
    use_linear_relation_between_m_flow_and_dp_for_any_flow_rate:
      alias: linearizeFlowResistance
      description: = true, use linear relation between m_flow and dp for any flow rate of the boiler (the Modelica default is false)
      ifabsent: string(false)
      range: string
      short_name: linearized
      numerical: true
    v_flow:
      alias: V_flow
      description: Volume flow rate values defining the boiler-circuit pump pressure curve [m3/s]
      func: 'lambda self: f''{self.nominal_mass_flow_rate_boiler}'' ''/1000*{0.5,1}'''
      type: str
    use_storage_tank:
      alias: useStorageTank
      description: None
      ifabsent: string(false)
      range: string
    temperature_heatpump_source:
      alias: TSouSet
      description: Constant source temperature of the heat pump [K], the water loop of the water-water heat pump, or the source of the air-water heat pump when heat_pump_source_outdoor_air is false
      ifabsent: float(286.15)
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
      short_name: heat_pump_source_temperature
    temperature_supply_setpoint_heat_pump:
      alias: TSet
      description: Supply temperature set point of the heat pump [K]; for the air-water heat pump, the supply temperature of the heating curve at the design outdoor temperature
      ifabsent: float(323.15)
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
      short_name: heat_pump_supply_setpoint
    loss_conductance:
      alias: UA
      description: Heat loss conductance of the boiler to its room [W/K], 1e-4 * nominal heating power (0.5 % of it at 50 K) by default; BoilerPolynomial of Buildings 13 subtracts this loss twice from the water
      range: float
      minimum_value: 0
    water_volume:
      alias: VWat
      description: Water volume of the boiler [m3], 1.5e-6 * nominal heating power by default
      range: float
      minimum_value: 0
    dry_mass:
      alias: mDry
      description: Dry mass of the boiler lumped to its water [kg], 1.5e-3 * nominal heating power by default
      range: float
      minimum_value: 0
    insulation_conductivity:
      alias: kIns
      description: Thermal conductivity of the tank insulation [W/(m.K)], 0.04 by default
      range: float
      minimum_value: 0
    ambient_temperature:
      alias: TAmbient
      description: Temperature of the room around the boiler and the tank, for their losses [K], 288.15 by default
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
    supply_temperature_setpoint:
      alias: TempSet
      description: Supply temperature set point of the boiler without storage [K], 353.15 by default
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
      libraries:
        buildings: &boiler_setpoint {name: TempSet, variants: [without_storage]}
        ideas: *boiler_setpoint
        reduced_order: *boiler_setpoint
        iso_13790: *boiler_setpoint
    fuel:
      description: Fuel of the boiler, a record of Buildings.Fluid.Data.Fuels such as NaturalGasLowerHeatingValue (the default), NaturalGasHigherHeatingValue, HeatingOilLowerHeatingValue or WoodAirDriedLowerHeatingValue
      range: string
      libraries:
        buildings: {handled: true}
        ideas: {handled: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
    heat_pump_nominal_source_temperature:
      alias: TEvaHea_nominal
      description: Source temperature at the rating point of the heat pump [K], where it delivers the nominal heating power at the supply temperature set point; the design outdoor temperature (air-water), the coldest ground temperature (ground-source) or the source temperature (water-water) by default
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
      libraries:
        buildings: &hp_source_temperature {name: TEvaHea_nominal, variants: [air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump]}
        ideas: *hp_source_temperature
        reduced_order: *hp_source_temperature
        iso_13790: *hp_source_temperature
    heat_pump_source_mass_flow:
      alias: mSou_flow_nominal
      description: Mass flow rate of the source side of the heat pump [kg/s], the one of the performance data scaled to the nominal heating power by default
      range: float
      minimum_value: 0
      libraries:
        buildings: &hp_source_flow {name: mSou_flow_nominal, variants: [air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump]}
        ideas: *hp_source_flow
        reduced_order: *hp_source_flow
        iso_13790: *hp_source_flow
    heat_pump_source_outdoor_air:
      alias: useOutdoorAirSource
      description: Whether the evaporator of the air-water heat pump takes the outdoor air of the weather data (true by default) or the constant temperature_heatpump_source (a sweep of the source temperature); Buildings and IDEAS only
      range: string
      libraries:
        buildings: &hp_air_water_only {name: useOutdoorAirSource, variants: [air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump]}
        ideas: *hp_air_water_only
        reduced_order: *hp_air_water_only
        iso_13790: *hp_air_water_only
    design_outdoor_temperature:
      alias: TOutDes
      description: Design outdoor temperature of the heating curve of the air-water heat pump [K], 265.15 (-8 degC, Uccle, NBN EN 12831) by default
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
      libraries:
        buildings: &hp_design_outdoor {name: TOutDes, variants: [air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump]}
        ideas: *hp_design_outdoor
        reduced_order: *hp_design_outdoor
        iso_13790: *hp_design_outdoor
    heating_limit_temperature:
      alias: TOutHeaLim
      description: Outdoor temperature above which the air-water heat pump does not heat [K], 289.15 by default
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
      libraries:
        buildings: &hp_heating_limit {name: TOutHeaLim, variants: [air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump]}
        ideas: *hp_heating_limit
        reduced_order: *hp_heating_limit
        iso_13790: *hp_heating_limit
    minimum_supply_temperature:
      alias: TSupMin
      description: Supply temperature of the heating curve of the air-water heat pump at the heating limit [K], 303.15 by default
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
      libraries:
        buildings: &hp_minimum_supply {name: TSupMin, variants: [air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump]}
        ideas: *hp_minimum_supply
        reduced_order: *hp_minimum_supply
        iso_13790: *hp_minimum_supply
    buffer_temperature_band:
      alias: dTHys
      description: Width of the buffer temperature band switching the air-water heat pump on and off around the supply set point [K], 5 by default
      range: float
      minimum_value: 0
      libraries:
        buildings: &hp_band {name: dTHys, variants: [air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump]}
        ideas: *hp_band
        reduced_order: *hp_band
        iso_13790: *hp_band
    compressor_minimum_on_time:
      alias: minOnTime
      description: Minimum time the compressor of the air-water heat pump runs once started [s], 300 by default
      range: float
      minimum_value: 0
      libraries:
        buildings: &hp_min_on {name: minOnTime, variants: [air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump]}
        ideas: *hp_min_on
        reduced_order: *hp_min_on
        iso_13790: *hp_min_on
    compressor_minimum_off_time:
      alias: minOffTime
      description: Minimum time the compressor of the air-water heat pump stays off once stopped [s], 300 by default
      range: float
      minimum_value: 0
      libraries:
        buildings: &hp_min_off {name: minOffTime, variants: [air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump]}
        ideas: *hp_min_off
        reduced_order: *hp_min_off
        iso_13790: *hp_min_off
    heat_pump_data:
      description: >-
        Performance data of the heat pump (air_water_heat_pump, ground_source_heat_pump, water_water_heat_pump):
        an EN 14511 record of Buildings 13 scaled to the nominal heating power (Vitocal251A08, the default of the
        air-water heat pump, an 8 kW air-water unit; SingleSplitRXM20R, a 2 kW air-air split; WAMAK_WaterToWater_220kW,
        a 220 kW water-water unit), `table` for the tables of heat_pump_table_heating_capacity and
        heat_pump_table_electrical_power, or `carnot` (the default of the ground-source and water-water heat
        pumps) for a constant Carnot effectiveness heat_pump_carnot_effectiveness
      range: string
      render: false
      libraries:
        buildings: &hp_handled {handled: true}
        ideas: *hp_handled
        reduced_order: *hp_handled
        iso_13790: *hp_handled
    heat_pump_carnot_effectiveness:
      description: >-
        Carnot effectiveness of the heat pump when heat_pump_data is carnot [1]: the COP is this fraction of the
        Carnot COP between the condenser outlet plus 5 K and the source minus 5 K (air) or 2 K (water); 0.45 by
        default, about 3.7 at A7/W35 and 4.4 at B0/W35
      range: float
      minimum_value: 0.1
      maximum_value: 0.8
      render: false
      libraries:
        buildings: *hp_handled
        ideas: *hp_handled
        reduced_order: *hp_handled
        iso_13790: *hp_handled
    heat_pump_table_source_temperatures:
      description: Source temperatures of the performance tables of the heat pump (heat_pump_data table) [K], the columns of the tables, increasing
      range: float
      multivalued: true
      render: false
      libraries:
        buildings: *hp_handled
        ideas: *hp_handled
        reduced_order: *hp_handled
        iso_13790: *hp_handled
    heat_pump_table_condenser_temperatures:
      description: Condenser outlet (supply) temperatures of the performance tables of the heat pump (heat_pump_data table) [K], the rows of the tables, increasing
      range: float
      multivalued: true
      render: false
      libraries:
        buildings: *hp_handled
        ideas: *hp_handled
        reduced_order: *hp_handled
        iso_13790: *hp_handled
    heat_pump_table_heating_capacity:
      description: >-
        Heating capacity table of the heat pump (heat_pump_data table) [W]: one row per condenser temperature, the
        values per source temperature separated by commas, the rows by semicolons, as "4490, 5170, 6470; 4230,
        4900, 6260"; a 0 marks a point outside the operating envelope
      range: string
      render: false
      libraries:
        buildings: *hp_handled
        ideas: *hp_handled
        reduced_order: *hp_handled
        iso_13790: *hp_handled
    heat_pump_table_electrical_power:
      description: Electrical power table of the heat pump (heat_pump_data table) [W], laid out as heat_pump_table_heating_capacity
      range: string
      render: false
      libraries:
        buildings: *hp_handled
        ideas: *hp_handled
        reduced_order: *hp_handled
        iso_13790: *hp_handled
    ground_temperature_mean:
      alias: TGroMea
      description: Mean temperature of the ground loop of the ground-source heat pump over the year [K], 283.15 by default
      range: float
      minimum_value: 253.15
      maximum_value: 323.15
      libraries:
        buildings: &hp_ground_only {name: TGroMea, variants: [ground_source_heat_pump]}
        ideas: *hp_ground_only
        reduced_order: *hp_ground_only
        iso_13790: *hp_ground_only
    ground_temperature_amplitude:
      alias: TGroAmp
      description: Amplitude of the annual variation of the ground loop temperature of the ground-source heat pump [K], 3 by default (the loop is coldest at the end of the heating season)
      range: float
      minimum_value: 0
      maximum_value: 20
      libraries:
        buildings: &hp_ground_amplitude {name: TGroAmp, variants: [ground_source_heat_pump]}
        ideas: *hp_ground_amplitude
        reduced_order: *hp_ground_amplitude
        iso_13790: *hp_ground_amplitude
    ground_coldest_day:
      alias: groColDay
      description: Day of the year when the ground loop of the ground-source heat pump is coldest [d], 45 (mid-February) by default
      range: float
      minimum_value: 0
      maximum_value: 366
      libraries:
        buildings: &hp_ground_day {name: groColDay, variants: [ground_source_heat_pump]}
        ideas: *hp_ground_day
        reduced_order: *hp_ground_day
        iso_13790: *hp_ground_day
    temperature_initial:
      alias: T_start
      description: Initial temperature of the boiler and of the tank water [K], 293.15 by default
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
  classes:
  - Boiler
ControlLoopsParameters:
  description: Parameters of the control loops of an air handling unit
  attributes:
    dt_hys:
      alias: dTHys
      description: Delta between the temperature hysteresis high and low limit [K]
      ifabsent: float(0.25)
      range: float
      minimum_value: 0
    k_coo_con:
      alias: kCooCon
      description: Gain of controller for cooling control loop [1]
      ifabsent: float(0.1)
      range: float
      minimum_value: 0
    k_hea_con:
      alias: kHeaCon
      description: Gain of controller for heating control loop [1]
      ifabsent: float(0.1)
      range: float
      minimum_value: 0
    loo_hys:
      alias: looHys
      description: Threshold value to check if the controller output is near zero [1]
      ifabsent: float(0.01)
      range: float
      minimum_value: 0
    ti_coo_con:
      alias: TiCooCon
      description: Time constant of integrator block for cooling control loop [s]
      ifabsent: float(900)
      range: float
      minimum_value: 0
      positive: true
    ti_hea_con:
      alias: TiHeaCon
      description: Time constant of integrator block for heating control loop [s]
      ifabsent: float(900)
      range: float
      minimum_value: 0
      positive: true
    tim_che:
      alias: timChe
      description: Threshold time to check the zone temperature status [s]
      ifabsent: float(30)
      range: float
      minimum_value: 0
  classes:

EmissionControlParameters:
  description: "Parameters of the control of an emitter: schedule, set points and control loop"
  attributes:
    schedule:
      alias: schedule
      description: Schedule of switching times that toggles the heating set point between the occupied set point and the setback value
      ifabsent: string(3600*{7, 19})
      range: string
    temperature_heating_setpoint:
      alias: THeaSet
      description: Room air temperature heating set point during occupied period [K], 21 degC by default (the design indoor temperature of dwellings)
      ifabsent: float(294.15)
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
    temperature_heating_setback:
      alias: THeaSetBack
      description: Room air temperature heating set point during the setback period (e.g. at night) [K]
      ifabsent: float(289)
      range: float
      minimum_value: 223.15
      maximum_value: 423.15
    controller_gain:
      alias: k
      description: Gain of controller [1]
      ifabsent: float(5)
      range: float
      minimum_value: 0
    data:
      alias: data
      description: Occupancy data sources
      range: DataSource
      multivalued: true
      inlined: true
      inlined_as_list: true
  classes:
  - EmissionControl
OccupancyParameters:
  description: Occupancy schedule and heat gains of the occupants of a space
  attributes:
    gain:
      alias: gain
      description: Gain to convert from occupancy (per person) to radiant, convective and latent heat in [W/m2]
      ifabsent: string([35; 70; 30])
      range: string
      default_from: >-
        f"[{self.sensible_heat_per_person * (0.5 if self.radiant_fraction is None else self.radiant_fraction):g};
        {self.sensible_heat_per_person * (1 - (0.5 if self.radiant_fraction is None else self.radiant_fraction)):g};
        {self.latent_heat_per_person or 0:g}]" if self.sensible_heat_per_person is not None else None
    heat_gain_if_occupied:
      alias: k
      description: Heat gain if occupied
      ifabsent: string(1/6/4)
      range: string
      short_name: occupant_density
    occupancy:
      alias: occupancy
      description: Occupancy table, each entry switching occupancy on or off
      ifabsent: string(3600*{7, 19})
      range: string
    ach:
      alias: ACH
      description: Infiltration [1/h]
      ifabsent: float(0.9)
      range: float
      minimum_value: 0
      deprecated: the infiltration of a zone is the `ach` parameter of its space
    floor_area:
      alias: AFlo
      description: Floor area [m2]
      range: float
      minimum_value: 0
      libraries:
        buildings: {name: AFlo, variants: [co2]}
        ideas: {name: AFlo, variants: [co2]}
        reduced_order: null
        iso_13790: null
    data:
      alias: data
      description: Occupancy data sources
      range: DataSource
      multivalued: true
      inlined: true
      inlined_as_list: true
    sensible_heat_per_person:
      description: Sensible heat released per occupant [W]; with the latent heat and the radiant fraction it gives the `gain` matrix when that one is absent
      range: float
      minimum_value: 0
      libraries:
        buildings: {handled: true}
        ideas: {handled: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
    latent_heat_per_person:
      description: Latent heat released per occupant [W]
      range: float
      minimum_value: 0
      libraries:
        buildings: {handled: true}
        ideas: {handled: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
    radiant_fraction:
      description: Radiant share of the sensible heat of the occupants [1]
      range: float
      minimum_value: 0
      maximum_value: 1
      libraries:
        buildings: {handled: true}
        ideas: {handled: true}
        reduced_order: {handled: true}
        iso_13790: {handled: true}
    lighting_power_density:
      alias: lightingPower
      description: Heat released by the lighting per floor area, all day [W/m2]
      range: float
      minimum_value: 0
      libraries:
        ideas: null
        reduced_order: {handled: true}
    lighting_radiant_fraction:
      alias: lightingRadiantFraction
      description: Radiant share of the lighting heat [1], 0.4 by default
      range: float
      minimum_value: 0
      maximum_value: 1
      libraries:
        ideas: null
        reduced_order: {handled: true}
    equipment_power_density:
      alias: equipmentPower
      description: Heat released by the equipment per floor area, all day [W/m2]
      range: float
      minimum_value: 0
      libraries:
        ideas: null
        reduced_order: {handled: true}
    equipment_radiant_fraction:
      alias: equipmentRadiantFraction
      description: Radiant share of the equipment heat [1], 0.4 by default
      range: float
      minimum_value: 0
      maximum_value: 1
      libraries:
        ideas: null
        reduced_order: {handled: true}
    activity_degree:
      alias: activityDegree
      description: Activity level of the occupants of the reduced-order zone [met], 1.2 by default
      range: float
      minimum_value: 0
      libraries:
        buildings: null
        ideas: null
        reduced_order: {handled: true}
        iso_13790: null
    co2_generation_per_person:
      alias: gCO2
      description: CO2 released per occupant [m3/s], 5.2e-6 by default (CO2 variant)
      range: float
      minimum_value: 0
      libraries:
        buildings: {name: gCO2, variants: [co2]}
        ideas: {name: gCO2, variants: [co2]}
        reduced_order: null
        iso_13790: null
    outdoor_co2_concentration:
      alias: ppmOut
      description: CO2 concentration of the outdoor air [ppm], 420 by default (CO2 variant)
      range: float
      minimum_value: 0
