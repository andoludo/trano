---
id: https://w3id.org/my-org/trano
name: trano
title: trano
description: |-
  This is the project description.
license: MIT
see_also:
  - https://my-org.github.io/trano
default_curi_maps:
  - semweb_context
prefixes:
  trano: https://w3id.org/my-org/trano/
  linkml: https://w3id.org/linkml/
  biolink: https://w3id.org/biolink/
  schema: http://schema.org/

  PATO: http://purl.obolibrary.org/obo/PATO_
  example: https://example.org/
  SYSTEM: http://example.org/SYSTEM/
  MATERIAL: http://example.org/MATERIAL/
  CONSTRUCTION: http://example.org/CONSTRUCTION/
  CONTROL: http://example.org/CONTROL/
  OCCUPANCY: http://example.org/OCCUPANCY/
  SPACE: http://example.org/SPACE/
default_prefix: trano
default_range: string

imports:
  - linkml:types


classes:
  Weather:
    slots:
      - parameters
    slot_usage:
      parameters:
        range: WeatherParameters
  Photovoltaic:
    slots:
      - id
      - name
    attributes:
      parameters:
        range: PhotovoltaicParameters
  Space:
    attributes:
      variant:
        ifabsent: string('default')
        range: SpaceVariant
    description: >-
      Represents a Space
    slot_usage:
      parameters:
        range: SpaceParameter
    slots:
      - id
      - name
      - external_boundaries
      - parameters
      - occupancy
      - emissions
      - ventilation_inlets
      - ventilation_outlets
    class_uri: schema:Space

  ExternalWall:
    attributes:
      construction:
        description: Construction
        range: Construction
    slots:
      - surface
      - azimuth
      - tilt
  FloorOnGround:
    attributes:
      construction:
        description: Construction
        range: Construction
      variant:
        description: >-
          What lies under the floor: the ground at a fixed temperature (default) or the outdoor air
          (outdoor_air, a raised floor)
        ifabsent: string('default')
        range: FloorOnGroundVariant
      ground_temperature:
        description: >-
          Temperature of the ground under the floor [K], 283.15 when absent (Buildings and the
          reduced-order zone; IDEAS and ISO 13790 model the ground themselves)
        range: float
      perimeter:
        description: Exposed perimeter of the slab [m] for the ground model of IDEAS, 4 times the square root of the surface when absent
        range: float
    slots:
      - surface
  InternalWall:
    attributes:
      construction:
        range: Construction
      space_1:
        range: Space
      space_1_tilt:
        range: string
      space_2:
        range: Space
      space_2_tilt:
        range: string
    slots:
      - surface
  Window:
    attributes:
      construction:
        description: Glazing
        range: Glazing
      width:
        range: float
      height:
        range: float
      frame_fraction:
        description: Share of the window area taken by the frame [1], 0.1 when absent
        range: float
      overhang:
        description: Horizontal projection above the window
        range: Overhang
        inlined: true
      side_fins:
        description: Vertical projections on both sides of the window
        range: SideFins
        inlined: true
    slots:
      - surface
      - azimuth
      - tilt
  Overhang:
    attributes:
      depth:
        description: Projection perpendicular to the wall [m]
        range: float
        required: true
      gap:
        description: Distance between the top of the window and the overhang [m], 0 when absent
        range: float
      width_left:
        description: Extension beyond the left edge of the window [m], 0 when absent
        range: float
      width_right:
        description: Extension beyond the right edge of the window [m], 0 when absent
        range: float
  SideFins:
    attributes:
      depth:
        description: Projection perpendicular to the wall [m]
        range: float
        required: true
      gap:
        description: Distance between the edges of the window and the fins [m], 0 when absent
        range: float
      height:
        description: Extension of the fins above the top of the window [m], 0 when absent
        range: float
  ExternalBoundaries:
    attributes:
      external_walls:
        range: ExternalWall
        multivalued: true
        inlined: true
      floor_on_grounds:
        range: FloorOnGround
        multivalued: true
        inlined: true
      windows:
        range: Window
        multivalued: true
        inlined: true

  Material:
    slots:
      - id
    attributes:
      thermal_conductivity:
        description: Thermal conductivity [W/(m.K)]
        range: float
      specific_heat_capacity:
        description: Specific thermal capacity [J/(kg.K)]
        range: float
      density:
        description: Density [kg/m3]
        range: float
      longwave_emissivity:
        description: Longwave emissivity [1]
        range: float
        ifabsent: float(0.85)
      shortwave_emissivity:
        description: Shortwave emissivity [1]
        range: float
        ifabsent: float(0.85)
      number_of_states:
        description: Spatial discretization of the layers (Buildings), number of states of a 0.2 m concrete reference layer scaled with the thickness and diffusivity of each layer [1]
        range: integer
        ifabsent: int(3)
  Gas:
    is_a: Material
  GlassMaterial:
    is_a: Material
    attributes:
      solar_transmittance:
        range: float
        multivalued: true
        ifabsent: float(0.6)
      solar_reflectance_outside_facing:
        range: float
        multivalued: true
        ifabsent: float(0.075)
      solar_reflectance_room_facing:
        range: float
        multivalued: true
        ifabsent: float(0.075)
      infrared_transmissivity:
        range: float
        ifabsent: float(0.0)
      infrared_absorptivity_outside_facing:
        range: float
        ifabsent: float(0.84)
      infrared_absorptivity_room_facing:
        range: float
        ifabsent: float(0.84)
  GlazingLayer:
    attributes:
      gas:
        description: Gas
        range: Gas
      glass:
        description: Glass
        range: GlassMaterial
      thickness:
        description: Thickness [m]
        range: float
  Layer:
    attributes:
      material:
        description: Material
        range: Material
      thickness:
        description: Thickness [m]
        range: float
  Construction:
    slots:
      - id
    attributes:
      layers:
        description: Layers
        range: Layer
        multivalued: true
  Glazing:
    slots:
      - id
    attributes:
      u_value_frame:
        description: U-value of the frame [W/(m2.K)]
        range: float
        ifabsent: float(1.4)
      u_value:
        description: U-value of the glazing [W/(m2.K)] for the libraries that take one (IDEAS, reduced order, ISO 13790); computed from the layers (EN 673) when absent
        range: float
      g_value:
        description: Solar energy transmittance of the glazing [1] for the libraries that take one (IDEAS, reduced order, ISO 13790); computed from the layers (EN 410) when absent
        range: float
      layers:
        description: Layers
        range: GlazingLayer
        multivalued: true
  Parameter:
    description: >-
      Represents Parameters
    slots:
      - name
    class_uri: schema:Parameter
  Occupancy:
    attributes:
      variant:
        range: OccupancyVariant
        ifabsent: string('default')
    description: >-
      Represents Occupancy
    slots:
      - parameters
    slot_usage:
      parameters:
        range: OccupancyParameters
    class_uri: schema:Occupancy

  System:
    attributes:
      variant:
        range: SystemVariant
        ifabsent: string('default')
    slots:
      - id
      - inlets
      - outlets
    class_uri: schema:System
  Systems:
    slots:
#      - valve
      - split_valve
      - three_way_valve
      - boiler
      - pump
      - temperature_sensor
      - heat_meter_sensor
      - air_handling_unit
      - power_sensor
      - chiller
      - dhw_tank
      - battery
      - ev_charger
    class_uri: schema:Systems
  Solar:
    slots:
      - photovoltaic
    class_uri: schema:Solar
  Emission:
    slots:
      - radiator
      - valve
      - ideal_heating_cooling
    class_uri: schema:Emission

  VentilationInlet:
    slots:
      - duct
      - vav
    class_uri: schema:VentilationInlet
  VentilationOutlet:
    slots:
      - duct
      - vav
    class_uri: schema:VentilationOutlet
  SplitValve:
    is_a: System
    attributes:
      parameters:
        range: SplitValveParameters
  Radiator:
    is_a: System
    attributes:
      control:
        range: Control #TODO: create radiator control


    slots:
      - parameters
    slot_usage:
      parameters:
        range: RadiatorParameter
  IdealHeatingCooling:
    is_a: System
    slots:
      - parameters
    slot_usage:
      parameters:
        range: IdealHeatingCoolingParameter
  Valve:
    is_a: System
    attributes:
      control:
        range: Control
    slots:
      - parameters
    slot_usage:
      parameters:
        range: ValveParameters
  ThreeWayValve:
    is_a: System
    attributes:
      parameters:
        range: ThreeWayValveParameters
      control:
        range: Control
  Boiler:
    is_a: System
    attributes:
      parameters:
        range: BoilerParameters
      control:
        range: Control
  AirHandlingUnit:
    is_a: System
    attributes:
      parameters:
        range: AhuParameters
      control:
        range: Control

  Pump:
    is_a: System
    attributes:
      parameters:
        range: PumpParameters
      control:
        range: Control
  VAV:
    is_a: System
    attributes:
      control:
        range: Control
      parameters:
        range: VavParameters
  Duct:
    is_a: System
    attributes:
      parameters:
        range: DuctParameters

  TemperatureSensor:
    is_a: System
    attributes:
      parameters:
        range: SensorParameters

  PowerSensor:
    is_a: System
  Chiller:
    is_a: System
    attributes:
      parameters:
        range: ChillerParameters
  DhwTank:
    is_a: System
    attributes:
      parameters:
        range: DhwTankParameters
  Battery:
    is_a: System
    attributes:
      parameters:
        range: BatteryParameters
  EvCharger:
    is_a: System
    attributes:
      parameters:
        range: EvChargerParameters
  HeatMeterSensor:
    is_a: System
    attributes:
      parameters:
        range: SensorParameters

  EmissionControl:

    slots:
      - id
    attributes:
      variant:
        ifabsent: string('default')
        range: EmissionControlVariant
      parameters:
        range: EmissionControlParameters
        multivalued: false
    class_uri: schema:EmissionControl
  BoilerControl:
    slots:
      - id
    attributes:
      variant:
        ifabsent: string('default')
        range: BoilerControlVariant
      parameters:
        range: BoilerControlParameters
        multivalued: false
    class_uri: schema:BoilerControl
  CollectorControl:
    slots:
      - id
    class_uri: schema:CollectorControl
  ThreeWayValveControl:
    slots:
      - id
    class_uri: schema:CollectorControl
  VavControl:
    attributes:
      variant:
        range: VavControlVariant
        ifabsent: string('default')
    slots:
      - id
    class_uri: schema:VavControl
  AhuControl:
    slots:
      - id
    class_uri: schema:AhuControl

  Control:
    slots:
      - emission_control
      - boiler_control
      - collector_control
      - three_way_valve_control
      - vav_control
      - ahu_control
    class_uri: schema:Control
  Default:
    attributes:
      material:
        range: Material
        inlined: true
        inlined_as_list: true
        multivalued: true
      gas:
        range: Gas
        inlined: true
        inlined_as_list: true
        multivalued: true
      glass_material:
        range: GlassMaterial
        inlined: true
        inlined_as_list: true
        multivalued: true
      glazings:
        range: Glazing
        inlined: true
        inlined_as_list: true
        multivalued: true
      constructions:
        range: Construction
        inlined: true
        inlined_as_list: true
        multivalued: true
  Building:
    tree_root: true
    description: >-
      A holder for Space objects
    attributes:
      default:
        range: Default
      material:
        range: Material
        inlined: true
        inlined_as_list: true
        multivalued: true
      gas:
        range: Gas
        inlined: true
        inlined_as_list: true
        multivalued: true
      glass_material:
        range: GlassMaterial
        inlined: true
        inlined_as_list: true
        multivalued: true
      glazings:
        range: Glazing
        inlined: true
        inlined_as_list: true
        multivalued: true
      constructions:
        range: Construction
        inlined: true
        inlined_as_list: true
        multivalued: true
      internal_walls:
        range: InternalWall
        inlined: true
        inlined_as_list: true
        multivalued: true
      spaces:
        range: Space
        inlined: true
        inlined_as_list: true
        multivalued: true
      systems:
        range: Systems
        inlined: true
        inlined_as_list: true
        multivalued: true
      weather:
        range: Weather
      solar:
        range: Solar
        inlined: true
        inlined_as_list: true
        multivalued: true



slots:
  id:
    identifier: true
    slot_uri: schema:identifier
    description: A unique identifier for a thing
  name:
    slot_uri: schema:name
    description: A human-readable name for a thing
  parameters:
    slot_uri: schema:parameters
    range: Parameter
    multivalued: false
  inlets:
    slot_uri: schema:inlets
    range: System
    multivalued: true
  outlets:
    slot_uri: schema:inlets
    range: System
    multivalued: true
  occupancy:
    slot_uri: schema:occupancy
    range: Occupancy
    multivalued: false
  radiator:
    range: Radiator
    multivalued: false
    inlined: true
  valve:
    range: Valve
    multivalued: false
    inlined: true
  ideal_heating_cooling:
    range: IdealHeatingCooling
    multivalued: false
    inlined: true
  three_way_valve:
    range: ThreeWayValve
    multivalued: false
    inlined: true
  temperature_sensor:
    range: TemperatureSensor
    multivalued: false
    inlined: true
  power_sensor:
    range: PowerSensor
    multivalued: false
    inlined: true
  chiller:
    range: Chiller
    multivalued: false
    inlined: true
  dhw_tank:
    range: DhwTank
    multivalued: false
    inlined: true
  battery:
    range: Battery
    multivalued: false
    inlined: true
  ev_charger:
    range: EvCharger
    multivalued: false
    inlined: true
  heat_meter_sensor:
    range: HeatMeterSensor
    multivalued: false
    inlined: true
  photovoltaic:
    range: Photovoltaic
    multivalued: false
    inlined: true
  split_valve:
    range: SplitValve
    multivalued: false
    inlined: true

  boiler:
    range: Boiler
    multivalued: false
    inlined: true

  air_handling_unit:
    range: AirHandlingUnit
    multivalued: false
    inlined: true

  pump:
    range: Pump
    multivalued: false
    inlined: true

  duct:
    range: Duct
    multivalued: false
    inlined: true
  vav:
    range: VAV
    multivalued: false
    inlined: true

  vav_control:
    range: VavControl
    multivalued: false
    inlined: true
  ahu_control:
    range: AhuControl
    multivalued: false
    inlined: true

  emissions:
    slot_uri: schema:emissions
    range: Emission
    multivalued: true
    inlined: true
  ventilation_inlets:
    slot_uri: schema:ventilation_inlets
    range: VentilationInlet
    multivalued: true
    inlined: true
  ventilation_outlets:
    slot_uri: schema:ventilation_outlets
    range: VentilationOutlet
    multivalued: true
    inlined: true
  emission_control:
    slot_uri: schema:emission_control
    range: EmissionControl
    multivalued: false
    inlined: true
  three_way_valve_control:
    slot_uri: schema:three_way_valve_control
    range: ThreeWayValveControl
    multivalued: false
    inlined: true
  collector_control:
    slot_uri: schema:collector_control
    range: CollectorControl
    multivalued: false
    inlined: true
  boiler_control:
    slot_uri: schema:boiler_control
    range: BoilerControl
    multivalued: false
    inlined: true
  external_boundaries:
    slot_uri: schema:external_boundaries
    range: ExternalBoundaries
    multivalued: false
  surface:
    slot_uri: schema:surface
    range: float
    description: Area in m2. For an external wall, the gross area of the facade, the windows cut out of it included.
  azimuth:
    slot_uri: schema:azimuth
    range: float
    description: Orientation of the surface in radians, 0 south, pi/2 west, pi north, -pi/2 east.
    minimum_value: -6.2832
    maximum_value: 6.2832
  tilt:
    slot_uri: schema:tilt
    range: string

enums:
  ControlType:
    permissible_values:
      Ahu:
      Boiler:
      Collector:
      Emission:
      VAV:
      ThreeWayValve:
  SpaceVariant:
    permissible_values:
      default:
      infiltration:
      rectangular_zone:
  FloorOnGroundVariant:
    permissible_values:
      default:
      outdoor_air:
  OccupancyVariant:
    permissible_values:
      default:
      co2:
      none:  # the space has no occupancy at all; an empty `occupancy:` gets the default one
  SystemVariant:
    permissible_values:
      default:
      air_water_heat_pump:
      complex:
      ideal:
      idealbus:
      system_d:
      test:
      water_water_heat_pump:
      without_storage:
  EmissionControlVariant:
    permissible_values:
      default:
      MonitoredSetpoint:
      onoff:
      PController:
  BoilerControlVariant:
    permissible_values:
      default:
      complex:
      simple:
  VavControlVariant:
    permissible_values:
      default:
      constant: