enums:
  SpaceVariant:
    description: Zone models
    permissible_values:
      default:
      infiltration:
      rectangular_zone:
  FloorOnGroundVariant:
    description: What lies under a floor on ground
    permissible_values:
      default:
      outdoor_air:
  OccupancyVariant:
    description: Occupancy models
    permissible_values:
      default:
      co2:
      none:  # the space has no occupancy at all; an empty `occupancy:` gets the default one
  SystemVariant:
    description: Every variant of every component class (each class accepts a subset)
    permissible_values:
      default:
      air_water_heat_pump:
      complex:
      ground_source_heat_pump:
      ideal:
      idealbus:
      system_d:
      test:
      water_water_heat_pump:
      without_storage:
  DefaultVariant:
    description: Variants of the components that have a single model
    permissible_values:
      default:
  BoilerVariant:
    description: Boiler and heat pump models
    permissible_values:
      default:
        description: Gas boiler with a storage tank
      air_water_heat_pump:
        description: Air-water heat pump with its buffer, on the outdoor air of the weather data
      ground_source_heat_pump:
        description: Ground-source (brine-water) heat pump with its buffer, on a ground loop whose temperature follows an annual sine
      water_water_heat_pump:
        description: Water-water heat pump with its buffer, on a water loop at a constant temperature
      without_storage:
        description: Gas boiler without storage tank
  RadiatorVariant:
    description: Radiator models
    permissible_values:
      default:
        description: Water radiator
      ideal:
        description: Ideal heater driven by its control
      idealbus:
        description: Ideal heater driven by its control through the data bus
  AirHandlingUnitVariant:
    description: Air handling unit models
    permissible_values:
      default:
      system_d:
      test:
  VavVariant:
    description: VAV box models
    permissible_values:
      default:
      complex:
  EmissionControlVariant:
    description: Control laws of the emitters
    permissible_values:
      default:
      MonitoredSetpoint:
      onoff:
      PController:
  BoilerControlVariant:
    description: Control laws of the generators
    permissible_values:
      default:
      complex:
      simple:
  VavControlVariant:
    description: Control laws of the VAV boxes
    permissible_values:
      default:
      constant:
