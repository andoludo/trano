classes:
  AdiabaticWall:
    description: 'Wall whose outer surface exchanges no heat, e.g. a party wall with
      a neighbouring dwelling heated like this one: the full construction is in the
      zone (thermal mass) with an adiabatic outer face.'
    slot_usage:
      construction:
        range: Construction
    slots:
    - construction
    - surface
    - azimuth
    - tilt
  AhuControl:
    description: Control of an air handling unit
    slots:
    - id
  AhuControlEntry:
    description: Control of an air handling unit
    slot_usage:
      ahu_control:
        required: true
    slots:
    - ahu_control
  AhuParameters:
    attributes:
      building_static_pressure:
        description: Static pressure of the building the supply fan maintains [Pa],
          12 by default (default variant)
        range: float
      heat_exchanger_effectiveness:
        description: Heat exchanger effectiveness [1]
        ifabsent: string(0.8)
        range: string
      outdoor_air_per_area:
        description: Outdoor air flow per floor area [m3/(s.m2)], 0.3e-3 by default
          (default variant, ASHRAE 62.1)
        minimum_value: 0
        range: float
      outdoor_air_per_person:
        description: Outdoor air flow per person [m3/s], 2.5e-3 by default (default
          variant, ASHRAE 62.1)
        minimum_value: 0
        range: float
      return_dp_nominal:
        description: Pressure rise of the return fan [Pa], the nominal pressure rise
          by default
        minimum_value: 0
        range: float
      supply_dp_nominal:
        description: Pressure rise of the supply fan [Pa], the nominal pressure rise
          by default
        minimum_value: 0
        range: float
    description: Parameters of an air handling unit
    slot_usage:
      dp_nominal:
        description: Nominal pressure raise [Pa]
        ifabsent: string(200)
        range: string
      m_flow_nominal:
        description: Nominal mass flow rate [kg/s]
        ifabsent: string(2*100*1.2/3600)
        range: string
    slots:
    - dp_nominal
    - m_flow_nominal
  AirHandlingUnit:
    description: Air handling unit supplying air to the spaces and extracting it from
      them
    is_a: System
    slot_usage:
      control:
        range: AhuControlEntry
      parameters:
        range: AhuParameters
      variant:
        description: Model of the component
        ifabsent: string('default')
        range: AirHandlingUnitVariant
    slots:
    - parameters
    - control
    - variant
  Battery:
    description: Electric battery (mpc library only)
    is_a: System
    slot_usage:
      parameters:
        range: BatteryParameters
      variant:
        description: Model of the component
        ifabsent: string('default')
        range: DefaultVariant
    slots:
    - parameters
    - variant
  BatteryParameters:
    attributes:
      capacity:
        description: Usable energy capacity [kWh]
        ifabsent: float(10.0)
        minimum_value: 0
        range: float
      discharge_efficiency:
        description: Discharging efficiency [1]
        ifabsent: float(0.95)
        maximum_value: 1
        minimum_value: 0
        range: float
      max_discharge_power:
        description: Maximum discharging power [W]
        ifabsent: float(5000)
        minimum_value: 0
        range: float
      max_soc:
        description: Upper bound of the state of charge [1]
        ifabsent: float(0.9)
        maximum_value: 1
        minimum_value: 0
        range: float
      min_soc:
        description: Lower bound of the state of charge [1]
        ifabsent: float(0.1)
        maximum_value: 1
        minimum_value: 0
        range: float
    description: Parameters of an electric battery (mpc library only)
    slot_usage:
      charge_efficiency:
        description: Charging efficiency [1]
        ifabsent: float(0.95)
        maximum_value: 1
        minimum_value: 0
        range: float
      initial_soc:
        description: Initial state of charge [1]
        ifabsent: float(0.5)
        maximum_value: 1
        minimum_value: 0
        range: float
      max_charge_power:
        description: Maximum charging power [W]
        ifabsent: float(5000)
        minimum_value: 0
        range: float
    slots:
    - max_charge_power
    - charge_efficiency
    - initial_soc
  Boiler:
    description: Heat generator with its storage tank and pump (boiler or heat pump,
      by variant)
    is_a: System
    slot_usage:
      control:
        range: BoilerControlEntry
      parameters:
        range: BoilerParameters
      variant:
        description: Model of the component
        ifabsent: string('default')
        range: BoilerVariant
    slots:
    - parameters
    - control
    - variant
  BoilerControl:
    description: Control of a boiler or heat pump charging its storage tank
    slot_usage:
      parameters:
        description: Parameters of the boiler control
        multivalued: false
        range: BoilerControlParameters
      variant:
        description: Control law of the generator
        ifabsent: string('default')
        range: BoilerControlVariant
    slots:
    - id
    - variant
    - parameters
  BoilerControlEntry:
    description: Control of a boiler or heat pump
    slot_usage:
      boiler_control:
        required: true
    slots:
    - boiler_control
  BoilerControlParameters:
    attributes:
      temperature_hysteresis:
        description: Hysteresis of the tank temperature checks that start and stop
          the boiler (default and complex variants; the simple variant has no such
          checks); 0 (the default) switches at each threshold crossing, about 1 K
          avoids their chattering (see the simulation performance page) [K]
        maximum_value: 10
        minimum_value: 0
        range: float
      threshold_outdoor_air_cutoff:
        description: Outdoor air temperature threshold; output is true when the outdoor
          air is below this heating cut-off limit [K]
        ifabsent: float(288.15)
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      threshold_to_switch_off_boiler:
        description: Tank bottom temperature above which the boiler switches off;
          defaults to tsup_nominal + 5 K [K]
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      tsup_nominal:
        description: Supply temperature set point; the boiler starts when the tank
          top drops 1 K below it [K]
        ifabsent: float(353.15)
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
    description: Parameters of the control of a boiler or heat pump
  BoilerParameters:
    attributes:
      ambient_temperature:
        description: Temperature of the room around the boiler and the tank, for their
          losses [K], 288.15 by default
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      buffer_temperature_band:
        description: Width of the buffer temperature band switching the air-water
          heat pump on and off around the supply set point [K], 5 by default
        minimum_value: 0
        range: float
      coefficients_for_efficiency_curve:
        description: Coefficients for efficiency curve
        ifabsent: string({0.9})
        range: string
      compressor_minimum_off_time:
        description: Minimum time the compressor of the air-water heat pump stays
          off once stopped [s], 300 by default
        minimum_value: 0
        range: float
      compressor_minimum_on_time:
        description: Minimum time the compressor of the air-water heat pump runs once
          started [s], 300 by default
        minimum_value: 0
        range: float
      cop_cross_term:
        description: Heat pump COP cross term outdoor x supply deviation, mpc library
          [1/K2]
        ifabsent: float(-0.0025)
        range: float
      cop_nominal:
        description: Heat pump COP at the rating point A7/W35, used by the mpc library
          [1]
        ifabsent: float(4.5)
        minimum_value: 0
        range: float
      cop_outdoor_slope:
        description: Heat pump COP change per kelvin of outdoor temperature, mpc library
          [1/K]
        ifabsent: float(0.11)
        range: float
      cop_supply_slope:
        description: Heat pump COP change per kelvin of supply temperature, mpc library
          [1/K]
        ifabsent: float(-0.075)
        range: float
      design_outdoor_temperature:
        description: Design outdoor temperature of the heating curve of the air-water
          heat pump [K], 265.15 (-8 degC, Uccle, NBN EN 12831) by default
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      diff_pressure:
        description: Pressure rise values defining the boiler-circuit pump pressure
          curve [Pa]
        ifabsent: string(5000*{2,1})
        range: string
      dry_mass:
        description: Dry mass of the boiler lumped to its water [kg], 1.5e-3 * nominal
          heating power by default
        minimum_value: 0
        range: float
      dt_boi_nominal:
        description: Nominal temperature difference for the boiler loop [K]
        ifabsent: float(20)
        minimum_value: 0
        range: float
      dt_rad_nominal:
        description: Nominal temperature difference for the radiator loop [K]
        ifabsent: float(10)
        minimum_value: 0
        range: float
      effcur:
        description: Curve used to compute the efficiency
        ifabsent: string(Buildings.Fluid.Types.EfficiencyCurves.Constant)
        range: string
      efficiency_curve:
        description: Same as effcur
        range: string
      efficiency_curve_coefficients:
        description: Same as coefficients_for_efficiency_curve
        range: string
      fraction_of_nominal_flow_rate_where_flow_transitions_to_laminar:
        description: Fraction of nominal flow rate where flow transitions to laminar
          [1]
        ifabsent: float(0.1)
        maximum_value: 1
        minimum_value: 0
        range: float
      fuel:
        description: Fuel of the boiler, a record of Buildings.Fluid.Data.Fuels such
          as NaturalGasLowerHeatingValue (the default), NaturalGasHigherHeatingValue,
          HeatingOilLowerHeatingValue or WoodAirDriedLowerHeatingValue
        range: string
      heat_pump_nominal_source_temperature:
        description: Source (outdoor air) temperature at the rating point of the air-water
          heat pump [K], where it delivers the nominal heating power at the supply
          temperature set point; the design outdoor temperature by default
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      heat_pump_source_mass_flow:
        description: Mass flow rate of the source side of the heat pump [kg/s], the
          one of the performance data scaled to the nominal heating power by default
        minimum_value: 0
        range: float
      heat_pump_source_outdoor_air:
        description: Whether the evaporator of the air-water heat pump takes the outdoor
          air of the weather data (true by default) or the constant temperature_heatpump_source
        range: string
      heat_pump_source_temperature:
        description: Same as temperature_heatpump_source
        range: float
      heat_pump_supply_setpoint:
        description: Same as temperature_supply_setpoint_heat_pump
        range: float
      heating_limit_temperature:
        description: Outdoor temperature above which the air-water heat pump does
          not heat [K], 289.15 by default
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      height_of_tank_without_insulation:
        description: Height of tank (without insulation) [m]
        ifabsent: float(2)
        minimum_value: 0
        range: float
      if_actual_temperature_at_port_is_computed:
        description: = true, if actual temperature at port is computed
        ifabsent: string(false)
        range: string
      insulation_conductivity:
        description: Thermal conductivity of the tank insulation [W/(m.K)], 0.04 by
          default
        minimum_value: 0
        range: float
      insulation_thickness:
        description: Same as thickness_of_insulation
        range: float
      laminar_transition_fraction:
        description: Same as fraction_of_nominal_flow_rate_where_flow_transitions_to_laminar
        range: float
      loss_conductance:
        description: Heat loss conductance of the boiler to its room [W/K], 1e-4 *
          nominal heating power (0.5 % of it at 50 K) by default; BoilerPolynomial
          of Buildings 13 subtracts this loss twice from the water
        minimum_value: 0
        range: float
      minimum_supply_temperature:
        description: Supply temperature of the heating curve of the air-water heat
          pump at the heating limit [K], 303.15 by default
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      nominal_efficiency_temperature:
        description: Same as temperature_used_to_compute_nominal_efficiency
        range: float
      number_of_volume_segments:
        description: Number of volume segments [1]
        ifabsent: int(4)
        minimum_value: 1
        range: integer
      sca_fac_rad:
        description: Scaling factor to scale the power (and mass flow rate) of the
          radiator loop [1]
        ifabsent: float(1.5)
        minimum_value: 0
        range: float
      show_temperature:
        description: Same as if_actual_temperature_at_port_is_computed
        range: string
      tank_height:
        description: Same as height_of_tank_without_insulation
        range: float
      tank_volume:
        description: Tank volume [m3]
        ifabsent: float(0.2)
        minimum_value: 0
        range: float
      temperature_heatpump_source:
        description: Constant source temperature of the heat pump [K], used when heat_pump_source_outdoor_air
          is false (and by the water-water heat pump)
        ifabsent: float(286.15)
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      temperature_supply_setpoint_heat_pump:
        description: Supply temperature set point of the heat pump [K]; for the air-water
          heat pump, the supply temperature of the heating curve at the design outdoor
          temperature
        ifabsent: float(323.15)
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      temperature_used_to_compute_nominal_efficiency:
        description: Temperature used to compute nominal efficiency (only used if
          efficiency curve depends on temperature) [K]
        ifabsent: float(353.15)
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      thickness_of_insulation:
        description: Thickness of insulation [m]
        ifabsent: float(0.1)
        minimum_value: 0
        range: float
      use_storage_tank:
        description: None
        ifabsent: string(false)
        range: string
      water_volume:
        description: Water volume of the boiler [m3], 1.5e-6 * nominal heating power
          by default
        minimum_value: 0
        range: float
    description: Parameters of a boiler or heat pump and of its storage tank
    slot_usage:
      dp_nominal:
        description: Pressure difference [Pa]
        ifabsent: float(5000)
        minimum_value: 0
        range: float
      linearized:
        description: Same as use_linear_relation_between_m_flow_and_dp_for_any_flow_rate
        range: string
      max_electrical_power:
        description: Maximum electrical power of the heat pump compressor, mpc library
          [W] (nominal heating power / COP when absent)
        minimum_value: 0
        range: float
      nominal_heating_power:
        description: Nominal heating power [W]
        ifabsent: float(20000)
        minimum_value: 0
        range: float
      supply_temperature_setpoint:
        description: Supply temperature set point of the boiler without storage [K],
          353.15 by default
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      temperature_initial:
        description: Initial temperature of the boiler and of the tank water [K],
          293.15 by default
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      use_linear_relation_between_m_flow_and_dp_for_any_flow_rate:
        description: = true, use linear relation between m_flow and dp for any flow
          rate of the boiler (the Modelica default is false)
        ifabsent: string(false)
        range: string
    slots:
    - dp_nominal
    - nominal_heating_power
    - use_linear_relation_between_m_flow_and_dp_for_any_flow_rate
    - linearized
    - max_electrical_power
    - supply_temperature_setpoint
    - temperature_initial
  Building:
    attributes:
      default:
        description: Library of materials, glazings and constructions, usually `!include_default`
        range: Default
      internal_walls:
        description: Walls, floors and ceilings between two spaces
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: InternalWall
      performance:
        description: Simplifications making the model simulate faster, all on by default
          (set them to false for the detailed model)
        inlined: true
        range: Performance
      solar:
        description: Solar components of the building
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Solar
      spaces:
        description: The thermal zones of the building
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Space
        required: true
      systems:
        description: The heating, cooling and ventilation components outside the spaces
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Systems
      weather:
        description: Weather data of the site
        range: Weather
    description: A building model, the root of a Trano YAML or JSON file
    slot_usage:
      constructions:
        description: Opaque constructions, in addition to the default ones
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Construction
      gas:
        description: Gases of the glazing cavities, in addition to the default ones
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Gas
      glass_material:
        description: Glasses of the glazing panes, in addition to the default ones
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: GlassMaterial
      glazings:
        description: Glazings of the windows, in addition to the default ones
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Glazing
      material:
        description: Opaque materials, in addition to the default ones
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Material
    slots:
    - gas
    - material
    - glass_material
    - glazings
    - constructions
    tree_root: true
  Chiller:
    description: Chiller (mpc library only)
    is_a: System
    slot_usage:
      parameters:
        range: ChillerParameters
      variant:
        description: Model of the component
        ifabsent: string('default')
        range: DefaultVariant
    slots:
    - parameters
    - variant
  ChillerParameters:
    attributes:
      eer_nominal:
        description: EER at 35 degC outdoor temperature [1]
        ifabsent: float(3.5)
        minimum_value: 0
        range: float
      eer_outdoor_slope:
        description: EER change per kelvin of outdoor temperature [1/K]
        ifabsent: float(-0.06)
        range: float
      nominal_cooling_power:
        description: Nominal cooling power [W]
        ifabsent: float(10000)
        minimum_value: 0
        range: float
    description: Parameters of a chiller (mpc library only)
    slot_usage:
      max_electrical_power:
        description: Maximum electrical power of the compressor [W] (nominal cooling
          power / EER when absent)
        minimum_value: 0
        range: float
    slots:
    - max_electrical_power
  CollectorControl:
    description: Control of a pump from the opening of the valves it serves
    slots:
    - id
  CollectorControlEntry:
    description: Control of a pump
    slot_usage:
      collector_control:
        required: true
    slots:
    - collector_control
  Construction:
    description: Opaque construction of walls, floors and roofs, as layers from the
      outside to the inside
    slot_usage:
      layers:
        description: Layers from the outside to the inside
        multivalued: true
        range: Layer
        required: true
    slots:
    - id
    - layers
  Control:
    description: Any control (exactly one key); each component takes the control of
      its own kind
    exactly_one_of:
    - slot_conditions:
        emission_control:
          name: emission_control
          required: true
    - slot_conditions:
        boiler_control:
          name: boiler_control
          required: true
    - slot_conditions:
        collector_control:
          name: collector_control
          required: true
    - slot_conditions:
        three_way_valve_control:
          name: three_way_valve_control
          required: true
    - slot_conditions:
        vav_control:
          name: vav_control
          required: true
    - slot_conditions:
        ahu_control:
          name: ahu_control
          required: true
    slots:
    - emission_control
    - boiler_control
    - collector_control
    - three_way_valve_control
    - vav_control
    - ahu_control
  ControlLoopsParameters:
    attributes:
      dt_hys:
        description: Delta between the temperature hysteresis high and low limit [K]
        ifabsent: float(0.25)
        minimum_value: 0
        range: float
      k_coo_con:
        description: Gain of controller for cooling control loop [1]
        ifabsent: float(0.1)
        minimum_value: 0
        range: float
      k_hea_con:
        description: Gain of controller for heating control loop [1]
        ifabsent: float(0.1)
        minimum_value: 0
        range: float
      loo_hys:
        description: Threshold value to check if the controller output is near zero
          [1]
        ifabsent: float(0.01)
        minimum_value: 0
        range: float
      ti_coo_con:
        description: Time constant of integrator block for cooling control loop [s]
        ifabsent: float(900)
        minimum_value: 0
        range: float
      ti_hea_con:
        description: Time constant of integrator block for heating control loop [s]
        ifabsent: float(900)
        minimum_value: 0
        range: float
      tim_che:
        description: Threshold time to check the zone temperature status [s]
        ifabsent: float(30)
        minimum_value: 0
        range: float
    description: Parameters of the control loops of an air handling unit
  DataSource:
    attributes:
      component:
        description: Name of the component providing the data
        range: string
        required: true
      variable:
        description: Name of the variable within the component
        range: string
        required: true
    description: Reference to a data source identified by a component and a variable
  Default:
    description: Library of materials, glazings and constructions available to every
      model
    slot_usage:
      constructions:
        description: Opaque constructions
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Construction
      gas:
        description: Gases of the glazing cavities
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Gas
      glass_material:
        description: Glasses of the glazing panes
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: GlassMaterial
      glazings:
        description: Glazings of the windows
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Glazing
      material:
        description: Opaque materials
        inlined: true
        inlined_as_list: true
        multivalued: true
        range: Material
    slots:
    - gas
    - material
    - glass_material
    - glazings
    - constructions
  DhwTank:
    description: Domestic hot water tank (mpc library only)
    is_a: System
    slot_usage:
      parameters:
        range: DhwTankParameters
      variant:
        description: Model of the component
        ifabsent: string('default')
        range: DefaultVariant
    slots:
    - parameters
    - variant
  DhwTankParameters:
    attributes:
      daily_draw_off_energy:
        description: Heat drawn by the hot water taps per day [kWh]
        ifabsent: float(8.0)
        minimum_value: 0
        range: float
      loss_coefficient:
        description: Standing loss coefficient of the tank [W/K]
        ifabsent: float(2.0)
        minimum_value: 0
        range: float
      min_temperature:
        description: Lower comfort bound of the tank temperature [K]
        ifabsent: float(318.15)
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      set_temperature:
        description: Upper comfort bound of the tank temperature [K]
        ifabsent: float(328.15)
        maximum_value: 423.15
        minimum_value: 223.15
        range: float
      supply_offset:
        description: Heat pump supply temperature above the tank temperature [K]
        ifabsent: float(5.0)
        minimum_value: 0
        range: float
      volume:
        description: Water volume of the tank [m3]
        ifabsent: float(0.2)
        minimum_value: 0
        range: float
      zone:
        description: Space receiving the standing losses of the tank (first space
          when absent)
        ifabsent: string(None)
        range: string
    description: Parameters of a domestic hot water tank (mpc library only)
  Duct:
    description: Air duct
    is_a: System
    slot_usage:
      parameters:
        range: DuctParameters
      variant:
        description: Model of the component
        ifabsent: string('default')
        range: DefaultVariant
    slots:
    - parameters
    - variant
  DuctParameters:
    description: Parameters of an air duct
    slot_usage:
      dp_nominal:
        description: Pressure drop of the duct at the nominal flow [Pa]
        ifabsent: float(40)
        minimum_value: 0
        range: float
      nominal_mass_flow_rate:
        description: Nominal air mass flow rate through the duct [kg/s]
        ifabsent: string(100*1.2/3600)
        range: string
    slots:
    - dp_nominal
    - nominal_mass_flow_rate
  Emission:
    description: 'One emission component of a space (exactly one key per entry). Water
      emitters are listed as [radiator, valve]: the water flows from the radiator
      to its valve.'
    exactly_one_of:
    - slot_conditions:
        radiator:
          name: radiator
          required: true
    - slot_conditions:
        valve:
          name: valve
          required: true
    - slot_conditions:
        ideal_heating_cooling:
          name: ideal_heating_cooling
          required: true
    slots:
    - radiator
    - valve
