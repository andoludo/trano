  outlets:
    description: Ids of the components the flow goes to
    multivalued: true
    range: System
  parameters:
    description: Parameters of the object; each class takes its own parameter set
    multivalued: false
    range: Parameter
  photovoltaic:
    description: Photovoltaic panels
    inlined: true
    multivalued: false
    range: Photovoltaic
  power_sensor:
    description: An electric power sensor of ideal heaters
    inlined: true
    multivalued: false
    range: PowerSensor
  pump:
    description: A circulation pump
    inlined: true
    multivalued: false
    range: Pump
  r:
    description: R; its meaning, range and default depend on the class (see slot_usage).
  radiant_fraction:
    description: Radiant fraction; its meaning, range and default depend on the class
      (see slot_usage).
  radiator:
    description: A radiator or ideal heater
    inlined: true
    multivalued: false
    range: Radiator
  range_of_significant_deviation_from_equal_percentage_law:
    description: Range of significant deviation from equal percentage law; its meaning,
