- https://github.com/andoludo/trano
slots:
  ach:
    description: Ach; its meaning, range and default depend on the class (see slot_usage).
  actuator_stroke_time:
    description: Actuator stroke time; its meaning, range and default depend on the
      class (see slot_usage).
  ahu_control:
    description: Control of an air handling unit
    inlined: true
    multivalued: false
    range: AhuControl
  air_handling_unit:
    description: An air handling unit
    inlined: true
    multivalued: false
    range: AirHandlingUnit
  azimuth:
    description: Orientation of the surface in radians, 0 south, pi/2 west, pi north,
      -pi/2 east.
    maximum_value: 6.2832
    minimum_value: -6.2832
    range: float
  battery:
    description: An electric battery (mpc library only)
    inlined: true
    multivalued: false
    range: Battery
  boiler:
    description: A boiler or heat pump
    inlined: true
    multivalued: false
    range: Boiler
  boiler_control:
    description: Control of a boiler or heat pump
    inlined: true
    multivalued: false
    range: BoilerControl
  charge_efficiency:
    description: Charge efficiency; its meaning, range and default depend on the class
      (see slot_usage).
  chiller:
    description: A chiller (mpc library only)
    inlined: true
    multivalued: false
    range: Chiller
  collector_control:
    description: Control of a pump
    inlined: true
    multivalued: false
    range: CollectorControl
  construction:
    description: Construction of the envelope element (an id of the constructions)
    range: Construction
    required: true
  constructions:
    description: Constructions; its meaning, range and default depend on the class
      (see slot_usage).
  control:
    description: Control of the component; each component class takes the control
      of its own kind
    inlined: true
    range: Control
  controller_gain:
    description: Controller gain; its meaning, range and default depend on the class
      (see slot_usage).
  controller_type:
    description: Controller type; its meaning, range and default depend on the class
      (see slot_usage).
  data:
    description: Data; its meaning, range and default depend on the class (see slot_usage).
  depth:
    description: Depth; its meaning, range and default depend on the class (see slot_usage).
  dhw_tank:
    description: A domestic hot water tank (mpc library only)
    inlined: true
    multivalued: false
    range: DhwTank
  dp_fixed_nominal:
    description: Dp fixed nominal; its meaning, range and default depend on the class
      (see slot_usage).
  dp_nominal:
    description: Dp nominal; its meaning, range and default depend on the class (see
      slot_usage).
  dp_valve_nominal:
    description: Dp valve nominal; its meaning, range and default depend on the class
      (see slot_usage).
  duct:
    description: An air duct
    inlined: true
    multivalued: false
    range: Duct
  emission_control:
    description: Control of an emitter
    inlined: true
    multivalued: false
    range: EmissionControl
  emissions:
    description: The emitters of the space, water radiators followed by their valve
    inlined: true
    multivalued: true
    range: Emission
  equal_percentage_deviation:
    description: Equal percentage deviation; its meaning, range and default depend
      on the class (see slot_usage).
  ev_charger:
    description: An electric vehicle charger (mpc library only)
    inlined: true
    multivalued: false
    range: EvCharger
  external_boundaries:
    description: Envelope elements of the space in contact with the outdoor air or
      the ground
    multivalued: false
    range: ExternalBoundaries
  floor_area:
    description: Floor area; its meaning, range and default depend on the class (see
      slot_usage).
  flow_coefficient_type:
    description: Flow coefficient type; its meaning, range and default depend on the
      class (see slot_usage).
  fraction_of_nominal_flow_rate_where_linearization_starts_if_y_1:
    description: Fraction of nominal flow rate where linearization starts if y 1;
      its meaning, range and default depend on the class (see slot_usage).
  fraction_of_nominal_mass_flow_rate_where_transition_to_turbulent_occurs:
    description: Fraction of nominal mass flow rate where transition to turbulent
      occurs; its meaning, range and default depend on the class (see slot_usage).
  from_dp:
    description: From dp; its meaning, range and default depend on the class (see
      slot_usage).
  gap:
    description: Gap; its meaning, range and default depend on the class (see slot_usage).
  gas:
    description: Gas; its meaning, range and default depend on the class (see slot_usage).
  glass_material:
    description: Glass material; its meaning, range and default depend on the class
      (see slot_usage).
  glazings:
    description: Glazings; its meaning, range and default depend on the class (see
      slot_usage).
  heat_meter_sensor:
    description: A heat meter
    inlined: true
    multivalued: false
    range: HeatMeterSensor
  height:
    description: Height; its meaning, range and default depend on the class (see slot_usage).
  id:
    description: A unique identifier for a thing
    identifier: true
  ideal_heating_cooling:
    description: An ideal heating and cooling device
    inlined: true
    multivalued: false
    range: IdealHeatingCooling
  initial_soc:
    description: Initial soc; its meaning, range and default depend on the class (see
      slot_usage).
  inlets:
    description: Ids of the components the flow comes from
    multivalued: true
    range: System
  k:
    description: K; its meaning, range and default depend on the class (see slot_usage).
  layers:
    description: Layers; its meaning, range and default depend on the class (see slot_usage).
  linearization_start_fraction:
    description: Linearization start fraction; its meaning, range and default depend
      on the class (see slot_usage).
  linearized:
    description: Linearized; its meaning, range and default depend on the class (see
      slot_usage).
  m_flow_nominal:
    description: M flow nominal; its meaning, range and default depend on the class
      (see slot_usage).
  material:
    description: Material; its meaning, range and default depend on the class (see
      slot_usage).
  max_charge_power:
    description: Max charge power; its meaning, range and default depend on the class
      (see slot_usage).
  max_electrical_power:
    description: Max electrical power; its meaning, range and default depend on the
      class (see slot_usage).
  name:
    description: A human-readable name for a thing
  nd:
    description: Nd; its meaning, range and default depend on the class (see slot_usage).
  ni:
    description: Ni; its meaning, range and default depend on the class (see slot_usage).
  nominal_heating_power:
    description: Nominal heating power; its meaning, range and default depend on the
      class (see slot_usage).
  nominal_mass_flow_rate:
    description: Nominal mass flow rate; its meaning, range and default depend on
      the class (see slot_usage).
  occupancy:
