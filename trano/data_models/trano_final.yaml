          required: true
    - slot_conditions:
        vav:
          name: vav
          required: true
    slots:
    - duct
    - vav
  VentilationOutlet:
    description: One component extracting air from a space (exactly one key per entry),
      in the order of the flow
    exactly_one_of:
    - slot_conditions:
        duct:
          name: duct
          required: true
    - slot_conditions:
        vav:
          name: vav
          required: true
    slots:
    - duct
    - vav
  Weather:
    description: Weather data of the site, read from a TMY3 (.mos) file
    slot_usage:
      parameters:
        range: WeatherParameters
    slots:
    - parameters
  WeatherParameters:
    attributes:
      atmospheric_pressure:
        description: Atmospheric pressure [Pa] when it is not read from the weather
          file, 101325 by default
        minimum_value: 0
        range: float
      atmospheric_pressure_source:
        description: Source of the atmospheric pressure, e.g. Buildings.BoundaryConditions.Types.DataSource.File
          to read it from the weather file; the library default (a constant 101325
          Pa) when absent
        ifabsent: string(None)
        range: string
      building_height:
        description: Height of the building [m] for the wind speed profile of the
          IDEAS simulation manager, 10 by default
        minimum_value: 0
        range: float
      default_n50:
        description: Air change rate at 50 Pa of the IDEAS zones that do not give
          their own [1/h], 3 by default
        minimum_value: 0
        range: float
      path:
        description: Name of weather data file
        ifabsent: string(None)
        range: string
    description: Weather file of the site
    slot_usage:
      outdoor_co2_concentration:
        description: CO2 concentration of the outdoor air of the IDEAS simulation
          manager [ppm], 400 by default
        minimum_value: 0
        range: float
    slots:
    - outdoor_co2_concentration
  Window:
    attributes:
      frame_fraction:
        description: Share of the window area taken by the frame [1], 0.1 when absent
        maximum_value: 1
        minimum_value: 0
        range: float
      overhang:
        description: Horizontal projection above the window
        inlined: true
        range: Overhang
      side_fins:
        description: Vertical projections on both sides of the window
        inlined: true
        range: SideFins
      width:
        description: Width of the window [m]; width x height must equal the surface
        minimum_value: 0
        range: float
    description: Glazed opening in an external wall of the same orientation
    slot_usage:
      azimuth:
        required: true
      construction:
        description: Glazing of the window (an id of the glazings, not of the constructions)
        range: Glazing
      height:
        description: Height of the window [m]; width x height must equal the surface
        minimum_value: 0
        range: float
    slots:
    - construction
    - surface
    - azimuth
    - tilt
    - height
default_prefix: trano
default_range: string
description: 'Schema of the YAML/JSON building models that Trano translates into Modelica:
  the spaces and their

  envelope (walls, windows, floors, internal walls), the constructions and materials,
  and the heating,

  cooling and ventilation systems with their controls. Temperatures are in kelvin,
  angles in radians and

  every other quantity in SI units.'
enums:
  AirHandlingUnitVariant:
    description: Air handling unit models
    permissible_values:
      default: null
      system_d: null
      test: null
  BoilerControlVariant:
    description: Control laws of the generators
    permissible_values:
      complex: null
      default: null
      simple: null
  BoilerVariant:
    description: Boiler and heat pump models
    permissible_values:
      air_water_heat_pump: null
      default:
        description: Gas boiler with a storage tank
      water_water_heat_pump: null
      without_storage:
        description: Gas boiler without storage tank
  DefaultVariant:
    description: Variants of the components that have a single model
    permissible_values:
      default: null
  EmissionControlVariant:
    description: Control laws of the emitters
    permissible_values:
      MonitoredSetpoint: null
      PController: null
      default: null
      onoff: null
  FloorOnGroundVariant:
    description: What lies under a floor on ground
    permissible_values:
      default: null
      outdoor_air: null
  OccupancyVariant:
    description: Occupancy models
    permissible_values:
      co2: null
      default: null
      none: null
  RadiatorVariant:
    description: Radiator models
    permissible_values:
      default:
        description: Water radiator
      ideal:
        description: Ideal heater driven by its control
      idealbus:
        description: Ideal heater driven by its control through the data bus
  SpaceVariant:
    description: Zone models
    permissible_values:
      default: null
      infiltration: null
      rectangular_zone: null
  SystemVariant:
    description: Every variant of every component class (each class accepts a subset)
    permissible_values:
      air_water_heat_pump: null
      complex: null
      default: null
      ideal: null
      idealbus: null
      system_d: null
      test: null
      water_water_heat_pump: null
      without_storage: null
  VavControlVariant:
    description: Control laws of the VAV boxes
    permissible_values:
      constant: null
      default: null
  VavVariant:
    description: VAV box models
    permissible_values:
      complex: null
      default: null
