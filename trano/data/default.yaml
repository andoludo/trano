# Default library of materials, glazings and constructions, included in a model with `default: !include_default`.
#
# Values: EN ISO 10456 (design values of building materials), EN ISO 6946 (air cavities), EN 673 and EN 410
# (glazings: U-value and g-value). Layers are listed from the outside to the inside. The thermal properties of a
# construction are those of its layers: thermal bridges (studs, rafters, wall ties) are not included. U-values in
# the comments: layers with the surface resistances of a wall (0.17 m2.K/W), without the ground under the floors.
constructions:
# --- floors on the ground ---
- id: FLOORONGROUND:001  # insulated slab on the ground, U = 0.31 W/(m2.K)
  layers:
  - material: CONCRETE:001
    thickness: 0.2
  - material: ROCKWOOL:001
    thickness: 0.1
  - material: SCREED:001
    thickness: 0.08
  - material: CONCRETE:001
    thickness: 0.015
- id: FLOORONGROUNDUNINSULATED:001  # slab on the ground without insulation (before 1980), U = 3.0 W/(m2.K)
  layers:
  - material: CONCRETE:001
    thickness: 0.15
  - material: SCREED:001
    thickness: 0.06
  - material: TILE:001
    thickness: 0.01
- id: INSULATEDFLOORHEATING:001  # slab with floor heating screed, U = 0.32 W/(m2.K)
  layers:
  - material: CONCRETE:001
    thickness: 0.1
  - material: PUR:001
    thickness: 0.07
  - material: SCREED:001
    thickness: 0.05
  - material: TILE:001
    thickness: 0.01
# --- floors and ceilings between storeys ---
- id: CONCRETESLAB:001  # 0.25 m concrete slab
  layers:
  - material: CONCRETE:001
    thickness: 0.125
  - material: CONCRETE:001
    thickness: 0.125
- id: TABS:001  # concrete slab with thermally activated core and a floating screed
  layers:
  - material: CONCRETE:001
    thickness: 0.125
  - material: CONCRETE:001
    thickness: 0.125
  - material: ROCKWOOL:001
    thickness: 0.01
  - material: SCREED:001
    thickness: 0.05
  - material: TILE:001
    thickness: 0.005
- id: TIMBERFLOOR:001  # timber joist floor: plasterboard ceiling, insulation between the joists, OSB and parquet
  layers:
  - material: GYPSUMBOARD:001
    thickness: 0.0125
  - material: GLASSWOOL:001
    thickness: 0.1
  - material: OSB:001
    thickness: 0.022
  - material: HARDWOOD:001
    thickness: 0.015
# --- external walls ---
- id: CAVITYWALL:001  # filled cavity wall, U = 0.28 W/(m2.K)
  layers:
  - material: BRICK:001
    thickness: 0.08
  - material: ROCKWOOL:001
    thickness: 0.1
  - material: BRICKHOLLOW:001
    thickness: 0.14
  - material: GYPSUM:001
    thickness: 0.015
- id: CAVITYWALLPARTIALFILL:001  # partially filled cavity wall with a 30 mm air cavity, U = 0.26 W/(m2.K)
  layers:
  - material: BRICK:001
    thickness: 0.08
  - material: AIRCAVITY:001
    thickness: 0.03
  - material: ROCKWOOL:001
    thickness: 0.1
  - material: BRICKHOLLOW:001
    thickness: 0.14
  - material: GYPSUM:001
    thickness: 0.015
- id: CAVITYWALLEMPTY:001  # cavity wall without insulation (1950-1980), U = 1.0 W/(m2.K)
  layers:
  - material: BRICK:001
    thickness: 0.09
  - material: AIRCAVITY:002
    thickness: 0.05
  - material: BRICKHOLLOW:001
    thickness: 0.14
  - material: GYPSUM:001
    thickness: 0.015
- id: SOLIDBRICKWALL:001  # solid brick wall without insulation (before 1945), U = 1.8 W/(m2.K)
  layers:
  - material: BRICK:001
    thickness: 0.3
  - material: GYPSUM:001
    thickness: 0.015
- id: ETICSWALL:001  # masonry with external insulation and render, U = 0.19 W/(m2.K)
  layers:
  - material: RENDER:001
    thickness: 0.01
  - material: EPS:001
    thickness: 0.16
  - material: BRICKHOLLOW:001
    thickness: 0.14
  - material: GYPSUM:001
    thickness: 0.015
- id: AACWALL:001  # autoclaved aerated concrete wall, rendered, U = 0.28 W/(m2.K)
  layers:
  - material: RENDER:001
    thickness: 0.01
  - material: YTONG:001
    thickness: 0.3
  - material: GYPSUM:001
    thickness: 0.01
- id: TIMBERFRAMEWALL:001  # timber frame wall with wood fibre sheathing, U = 0.16 W/(m2.K)
  layers:
  - material: WOODFIBRE:001
    thickness: 0.06
  - material: GLASSWOOL:001
    thickness: 0.16
  - material: OSB:001
    thickness: 0.015
  - material: GYPSUMBOARD:001
    thickness: 0.0125
# --- internal walls ---
- id: INTERNALWALLMASONRY:001  # plastered hollow brick partition
  layers:
  - material: GYPSUM:001
    thickness: 0.01
  - material: BRICKHOLLOW:001
    thickness: 0.14
  - material: GYPSUM:001
    thickness: 0.01
- id: INTERNALWALLLIGHT:001  # plasterboard stud partition with mineral wool
  layers:
  - material: GYPSUMBOARD:001
    thickness: 0.0125
  - material: GLASSWOOL:001
    thickness: 0.075
  - material: GYPSUMBOARD:001
    thickness: 0.0125
# --- roofs ---
- id: PITCHEDROOF:001  # insulated pitched roof under ventilated tiles (the tiles are left out, EN ISO 6946), U = 0.15 W/(m2.K)
  layers:
  - material: WOODFIBRE:001
    thickness: 0.035
  - material: GLASSWOOL:001
    thickness: 0.2
  - material: GYPSUMBOARD:001
    thickness: 0.0125
- id: FLATROOF:001  # warm flat roof on a concrete slab, U = 0.17 W/(m2.K)
  layers:
  - material: BITUMEN:001
    thickness: 0.01
  - material: PIR:001
    thickness: 0.14
  - material: CONCRETE:001
    thickness: 0.2
  - material: GYPSUM:001
    thickness: 0.01
- id: UNINSULATEDROOF:001  # pitched roof without insulation (before 1970): tiles and a plasterboard ceiling, U = 2.6 W/(m2.K)
  layers:
  - material: ROOFTILE:001
    thickness: 0.015
  - material: PLYWOOD:001
    thickness: 0.018
  - material: GYPSUMBOARD:001
    thickness: 0.0125
# Gases filling the cavities of glazings, at 10 degC (EN 673).
gas:
- density: 5.46
  id: XENON:001
  longwave_emissivity: 0.0
  shortwave_emissivity: 0.0
  specific_heat_capacity: 158.0
  thermal_conductivity: 0.0055
- density: 1.2
  id: AIR:001
  longwave_emissivity: 0.0
  shortwave_emissivity: 0.0
  specific_heat_capacity: 1006.0
  thermal_conductivity: 0.0256
- density: 3.48
  id: KRYPTON:001
  longwave_emissivity: 0.0
  shortwave_emissivity: 0.0
  specific_heat_capacity: 248.0
  thermal_conductivity: 0.0092
- density: 1.66
  id: ARGON:001
  longwave_emissivity: 0.0
  shortwave_emissivity: 0.0
  specific_heat_capacity: 522.0
  thermal_conductivity: 0.0174
# Panes: solar values at normal incidence (EN 410). The low-e panes carry a soft coating (emissivity 0.04) on one
# face, which must face the gas cavity: LOWEGLASS:001 is an outer pane (coating on its room face),
# LOWEGLASS:002 an inner pane (coating on its outside face).
glass_material:
- density: 2500.0
  id: GLASS:001  # clear float glass
  longwave_emissivity: 0.84
  shortwave_emissivity: 0.67
  specific_heat_capacity: 840.0
  thermal_conductivity: 1.0
  solar_transmittance: [0.83]
  solar_reflectance_outside_facing: [0.075]
  solar_reflectance_room_facing: [0.075]
  infrared_transmissivity: 0.0
  infrared_absorptivity_outside_facing: 0.84
  infrared_absorptivity_room_facing: 0.84
- density: 2500.0
  id: LOWEGLASS:001  # low-e glass, coating on the room face (outer pane)
  longwave_emissivity: 0.84
  shortwave_emissivity: 0.67
  specific_heat_capacity: 840.0
  thermal_conductivity: 1.0
  solar_transmittance: [0.63]
  solar_reflectance_outside_facing: [0.19]
  solar_reflectance_room_facing: [0.24]
  infrared_transmissivity: 0.0
  infrared_absorptivity_outside_facing: 0.84
  infrared_absorptivity_room_facing: 0.04
- density: 2500.0
  id: LOWEGLASS:002  # low-e glass, coating on the outside face (inner pane)
  longwave_emissivity: 0.84
  shortwave_emissivity: 0.67
  specific_heat_capacity: 840.0
  thermal_conductivity: 1.0
  solar_transmittance: [0.63]
  solar_reflectance_outside_facing: [0.24]
  solar_reflectance_room_facing: [0.19]
  infrared_transmissivity: 0.0
  infrared_absorptivity_outside_facing: 0.04
  infrared_absorptivity_room_facing: 0.84
# Center-of-glass values (EN 673, EN 410) in the comments.
glazings:
- id: INS2AR2020:001  # double glazing, low-e, argon: U = 1.1 W/(m2.K), g = 0.63
  layers:
  - glass: GLASS:001
    thickness: 0.006
  - gas: ARGON:001
    thickness: 0.016
  - glass: LOWEGLASS:002
    thickness: 0.006
- id: INS3AR2020:001  # triple glazing, two low-e coatings, argon: U = 0.58 W/(m2.K), g = 0.47
  layers:
  - glass: LOWEGLASS:001
    thickness: 0.006
  - gas: ARGON:001
    thickness: 0.016
  - glass: GLASS:001
    thickness: 0.006
  - gas: ARGON:001
    thickness: 0.016
  - glass: LOWEGLASS:002
    thickness: 0.006
- id: INS2KR2020:001  # double glazing, low-e, krypton: U = 0.96 W/(m2.K), g = 0.63
  layers:
  - glass: GLASS:001
    thickness: 0.004
  - gas: KRYPTON:001
    thickness: 0.012
  - glass: LOWEGLASS:002
    thickness: 0.004
- id: INS3KR2020:001  # triple glazing, two low-e coatings, krypton: U = 0.45 W/(m2.K), g = 0.47
  layers:
  - glass: LOWEGLASS:001
    thickness: 0.004
  - gas: KRYPTON:001
    thickness: 0.012
  - glass: GLASS:001
    thickness: 0.004
  - gas: KRYPTON:001
    thickness: 0.012
  - glass: LOWEGLASS:002
    thickness: 0.004
- id: INS2AIR2000:001  # double glazing, low-e, air (1995-2010): U = 1.4 W/(m2.K), g = 0.63
  layers:
  - glass: GLASS:001
    thickness: 0.004
  - gas: AIR:001
    thickness: 0.015
  - glass: LOWEGLASS:002
    thickness: 0.004
- id: EPCDOUBLE:001  # clear double glazing, air (1970-1995): U = 2.9 W/(m2.K), g = 0.76
  layers:
  - glass: GLASS:001
    thickness: 0.0038
  - gas: AIR:001
    thickness: 0.012
  - glass: GLASS:001
    thickness: 0.0038
- id: EPCSINGLE:001  # single glazing: U = 5.8 W/(m2.K), g = 0.86
  layers:
  - glass: GLASS:001
    thickness: 0.0038
