# --- air cavities in opaque constructions ---
# An unventilated vertical air cavity transfers heat by convection and radiation: its resistance is 0.18 m2.K/W
# from 25 mm on (EN ISO 6946), not the 1.2 m2.K/W of 30 mm of still air. These are equivalent conductivities
# for one thickness each: use AIRCAVITY:001 with 0.03 m and AIRCAVITY:002 with 0.05 m.
- density: 1.2
  id: AIRCAVITY:001  # 30 mm, R = 0.18 m2.K/W
  longwave_emissivity: 0.9
  shortwave_emissivity: 0.6
  specific_heat_capacity: 1006.0
  thermal_conductivity: 0.167
- density: 1.2
  id: AIRCAVITY:002  # 50 mm, R = 0.18 m2.K/W
  longwave_emissivity: 0.9
  shortwave_emissivity: 0.6
  specific_heat_capacity: 1006.0
  thermal_conductivity: 0.278
- density: 1.23
  id: NONE:001  # placeholder layer without thermal resistance or mass
  longwave_emissivity: 0.8
  shortwave_emissivity: 0.8
  specific_heat_capacity: 1008.0
  thermal_conductivity: 1000.0
