    targets:
    - DataBus
    use_counter: false
  template: |-
    {{ package_name }}.Components.BaseClasses.Valve{{ element.name | capitalize }} {{ element.name }}(m_flow_nominal={{ parameters.m_flow_nominal }})
  runnable: &control_runnable
    declaration: |-
      {%- if element.name ~ '_y' not in columns -%}
      Modelica.Blocks.Sources.Constant {{ element.name }}_y(k=1) "Control held without external data";
      {%- endif -%}
    equation: |-
      {%- if element.name ~ '_y' in columns -%}
      connect(data_bus.y[{{ columns.index(element.name ~ '_y') + 1 }}], mpc.{{ element.name }}_y.y);
      {%- else -%}
      connect({{ element.name }}_y.y, mpc.{{ element.name }}_y.y);
      {%- endif -%}
  variant: default

# Mixing valve: port_1 the supply, port_3 the bypass from the return (trano connects the bypass of a split valve
# to port_3, as for the Buildings library).
- classes:
  - ThreeWayValve
  library: FastModel
  parameter_processing: &three_way_parameters
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    names:
    - port_1[1]
  - flow: outlet
    medium: fluid
    names:
    - port_2[1]
  - flow: inlet_or_outlet
    medium: fluid
    names:
    - port_3[1]
  - flow: undirected
    medium: data
    names:
    - y
    targets:
    - Control
    no_check: true
  template: |-
    FastModel.Hydronics.ThreeWayValve {{ element.name }}(
        pressureDriven=true,
        m_flow_nominal={{ parameters.m_flow_nominal }},
        dpValve_nominal={{ parameters.dpValve_nominal }},
        dpFixed_nominal={{ parameters.dpFixed_nominal }},
        fraK={{ parameters.fraK }},
        R={{ parameters.R }},
        l={{ parameters.l }},
        delta0={{ parameters.delta0 }}
        {%- if not element.control %},
        y=1{% endif %})
  variant: default

- classes:
  - ThreeWayValve
  library: FastModelMPC
  component_template:
    bus:
      real_inputs:
      - component: ""
        name: y
        port: y
        target:
          main: element.name
        model_input:
          declaration: |-
            FastModel.Interfaces.ControlInput {{ element.name }}_y "Share of supply water of {{ element.name }}: input of the model";
          port: "{{ element.name }}_y.y"
    category: control
    template: |-
      model ThreeWayValve{{ element.name | capitalize }}
        extends FastModel.Hydronics.ThreeWayValve;
        {{ bus_template }}
      equation
        {{ bus_ports | safe }}
      end ThreeWayValve{{ element.name | capitalize }};
  parameter_processing: *three_way_parameters
  ports:
  - flow: inlet
    medium: fluid
    names:
    - port_1[1]
  - flow: outlet
    medium: fluid
    names:
    - port_2[1]
  - flow: inlet_or_outlet
    medium: fluid
    names:
    - port_3[1]
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - dataBus
    targets:
    - DataBus
    use_counter: false
  template: |-
    {{ package_name }}.Components.BaseClasses.ThreeWayValve{{ element.name | capitalize }} {{ element.name }}(m_flow_nominal={{ parameters.m_flow_nominal }})
  runnable: *control_runnable
  variant: default

- classes:
  - SplitValve
  library: [FastModel, FastModelMPC]
  parameter_processing:
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_1
  - flow: outlet
    medium: fluid
    names:
    - port_2[1]
  - flow: inlet_or_outlet
    medium: fluid
    names:
    - port_3[1]
  template: |-
    FastModel.Hydronics.{{ 'Junction' if macros.connections(element, 'port_3[1]') | int else 'Junction2' }} {{ element.name }}(
        {%- if library == 'FastModel' %}
        pressureDriven=true,
        dp_nominal={{ parameters.dp_nominal }},
        m_flow_nominal={{ parameters.m_flow_nominal }},
        {%- endif %}
        nPorts_1={{ macros.connections(element, 'port_1') }})
  variant: default

# Pumps: on their curve at the speed of their collector control (closed loop, full speed without one), or
# pass-through (MPC: the valves set the flows).
- classes:
  - Pump
  library: [FastModel, FastModelMPC]
  parameter_processing:
    function: default_parameters
  ports: &multi_fluid_ports
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
  template: |-
    FastModel.Hydronics.Pump {{ element.name }}(
        nPorts_a={{ macros.connections(element, 'port_a') }},
        nPorts_b={{ macros.connections(element, 'port_b') }},
        dp_nominal={{ parameters.dp_nominal }},
        m_flow_nominal={{ parameters.m_flow_nominal }},
        {%- if library == 'FastModel' %}
        pressureDriven=true,
        y={{ element.control.name ~ '.y' if element.control else '1' }})
        {%- else %}
        y=1)
        {%- endif %}
  variant: default

- classes:
  - TemperatureSensor
  library: [FastModel, FastModelMPC]
  parameter_processing: &sensor_parameters
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
  - &sensor_temperature
    flow: undirected
    medium: data
    names:
    - T
    targets:
    - Control
    no_check: true
  template: &sensor_template |-
    FastModel.Hydronics.TemperatureSensor {{ element.name }}(
        {%- if library == 'FastModel' %}
        pressureDriven=true,
        {%- if parameters.get('m_flow_nominal') is not none %}
        m_flow_nominal={{ parameters.m_flow_nominal }},
        {%- endif %}
        {%- endif %}
        nPorts_a={{ macros.connections(element, 'port_a') }},
        nPorts_b={{ macros.connections(element, 'port_b') }})
  variant: default

# Heat meters: a temperature sensor on the water between the boiler and the pump. The temperature sensor it reads
# the return temperature from is a signal in Buildings (TExt), not water: the meter's water only comes from and goes
# to the boiler and the pump.
- classes:
  - HeatMeterSensor
  library: [FastModel, FastModelMPC]
  parameter_processing: *sensor_parameters
  ports:
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
    targets:
    - Pump
    - Boiler
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
    targets:
    - Pump
    - Boiler
  - *sensor_temperature
  template: *sensor_template
  variant: default

# Boilers without storage tank (Buildings BoilerPolynomial): the part load ratio from a P controller on the boiler
# temperature while its control sees demand (closed loop), or the input <boiler>_y read from the data bus (MPC).
- classes:
  - Boiler
  library: FastModel
  parameter_processing: &boiler_parameters
    function: default_parameters
  ports: *multi_fluid_ports
  template: &boiler_template |-
    {%- if parameters.useStorageTank | string | lower == 'true' -%}
    {{ unsupported('Boiler ' ~ element.name ~ ' has a storage tank: the FastModel library has no tank yet.') }}
    {%- endif -%}
    {%- set demand = element.control.name ~ '.y' if element.control and element.control.variant == 'simple' and (element.control.pumps or []) | selectattr('control') | list else '1' -%}
    FastModel.Controls.BoilerTemperatureControl {{ element.name }}_control(
        TempSet={{ parameters.get('TempSet', 353.15) }}, T={{ element.name }}.T, demand={{ demand }})
        "Firing of {{ element.name }}";
    FastModel.Hydronics.Boiler {{ element.name }}(
        nPorts_a={{ macros.connections(element, 'port_a') }},
        nPorts_b={{ macros.connections(element, 'port_b') }},
        Q_flow_nominal={{ parameters.Q_flow_nominal }},
        effCur=FastModel.Types.EfficiencyCurves.{{ parameters.effCur.split('.')[-1] }},
        a={{ parameters.a }},
        T_nominal={{ parameters.T_nominal }},
        pressureDriven=true,
        m_flow_nominal={{ parameters.nominal_mass_flow_rate_boiler }},
        dp_nominal={{ parameters.dp_nominal }},
        y={{ element.name }}_control.y)
  variant: default

- classes:
  - Boiler
  library: FastModel
  parameter_processing: *boiler_parameters
  ports: *multi_fluid_ports
  template: *boiler_template
  variant: without_storage

- classes:
  - Boiler
  library: FastModelMPC
  component_template: &boiler_component
    bus:
      real_inputs:
      - component: ""
        name: y
        port: y
        target:
          main: element.name
        model_input:
          declaration: |-
            FastModel.Interfaces.ControlInput {{ element.name }}_y "Part load ratio of {{ element.name }}: input of the model";
          port: "{{ element.name }}_y.y"
    category: boiler
    template: |-
      model Boiler{{ element.name | capitalize }}
        extends FastModel.Hydronics.Boiler;
        {{ bus_template }}
      equation
        {{ bus_ports | safe }}
      end Boiler{{ element.name | capitalize }};
  parameter_processing: *boiler_parameters
  ports: &boiler_bus_ports
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - dataBus
    targets:
    - DataBus
    use_counter: false
  template: &boiler_mpc_template |-
    {%- if parameters.useStorageTank | string | lower == 'true' -%}
    {{ unsupported('Boiler ' ~ element.name ~ ' has a storage tank: the FastModel library has no tank yet.') }}
    {%- endif -%}
    {{ package_name }}.Components.BaseClasses.Boiler{{ element.name | capitalize }} {{ element.name }}(
        nPorts_a={{ macros.connections(element, 'port_a') }},
        nPorts_b={{ macros.connections(element, 'port_b') }},
        Q_flow_nominal={{ parameters.Q_flow_nominal }},
        effCur=FastModel.Types.EfficiencyCurves.{{ parameters.effCur.split('.')[-1] }},
        a={{ parameters.a }},
        T_nominal={{ parameters.T_nominal }})
  runnable: &control_runnable_boiler
    declaration: |-
      {%- if element.name ~ '_y' not in columns -%}
      Modelica.Blocks.Sources.Constant {{ element.name }}_y(k=1) "Control held without external data";
      {%- endif -%}
    equation: |-
      {%- if element.name ~ '_y' in columns -%}
      connect(data_bus.y[{{ columns.index(element.name ~ '_y') + 1 }}], mpc.{{ element.name }}_y.y);
      {%- else -%}
      connect({{ element.name }}_y.y, mpc.{{ element.name }}_y.y);
      {%- endif -%}
  variant: default

- classes:
  - Boiler
  library: FastModelMPC
  component_template: *boiler_component
  parameter_processing: *boiler_parameters
  ports: *boiler_bus_ports
  template: *boiler_mpc_template
  runnable: *control_runnable_boiler
  variant: without_storage

# Air-to-water heat pump (trano's Buildings air_water_heat_pump: Vitocal 251-A08 tables scaled to the capacity)
# with its buffer, the outdoor air its source (the weather from the data bus): the compressor speed from the control
# of the Buildings model (closed loop), or the input <heat pump>_y read from the data bus (MPC).
- classes:
  - Boiler
  library: FastModel
  component_template:
    bus:
      real_inputs:
      - component: weaBus
        name: TDryBul
        port: TDryBul
        target:
          main: element
      - component: weaBus
        name: TBlaSky
        port: TBlaSky
        target:
          main: element
      - component: weaBus
        name: winSpe
        port: winSpe
        target:
          main: element
      - component: weaBus
        name: winDir
        port: winDir
        target:
          main: element
      - component: weaBus
        name: HDirNor
        port: HDirNor
        target:
          main: element
      - component: weaBus
        name: HDifHor
        port: HDifHor
        target:
          main: element
      - component: weaBus
        name: HGloHor
        port: HGloHor
        target:
          main: element
      - component: weaBus
        name: lat
        port: lat
        target:
          main: element
      - component: weaBus
        name: decAng
        port: decAng
        target:
          main: element
      - component: weaBus
        name: solHouAng
        port: solHouAng
        target:
          main: element
      - component: weaBus
        name: cosZen
        port: cosZen
        target:
          main: element
      - component: weaBus
        name: F1
        port: F1
        target:
          main: element
      - component: weaBus
        name: F2
        port: F2
        target:
          main: element
    category: boiler
    template: &heat_pump_wrapper |-
      model HeatPump{{ element.name | capitalize }}
        extends FastModel.Hydronics.HeatPump;
        {{ bus_template }}
      equation
        {{ bus_ports | safe }}
      end HeatPump{{ element.name | capitalize }};
  parameter_processing: *boiler_parameters
  ports: *boiler_bus_ports
  template: |-
    {%- set demand = element.control.name ~ '.y' if element.control and element.control.variant == 'simple' and (element.control.pumps or []) | selectattr('control') | list else '1' -%}
    FastModel.Controls.HeatPumpControl {{ element.name }}_control(
        TSet={{ parameters.TSet }},
        {%- for name in ['TOutDes', 'TSupMin', 'TOutHeaLim', 'dTHys'] %}
        {%- if parameters.get(name) is not none %}
        {{ name }}={{ parameters[name] }},
        {%- endif %}
        {%- endfor %}
        demand={{ demand }},
        TOut={{ element.name }}.weaBus.TDryBul,
        TBuf={{ element.name }}.T,
        TConOut={{ element.name }}.TConOut) "Control of {{ element.name }}";
    {{ package_name }}.Components.BaseClasses.HeatPump{{ element.name | capitalize }} {{ element.name }}(
        nPorts_a={{ macros.connections(element, 'port_a') }},
        nPorts_b={{ macros.connections(element, 'port_b') }},
        Q_flow_nominal={{ parameters.Q_flow_nominal }},
        TSet={{ parameters.TSet }},
        {%- if parameters.get('TOutDes') is not none %}
        TOutDes={{ parameters.TOutDes }},
        {%- endif %}
        useStorageTank={{ parameters.useStorageTank | string | lower }},
        VTan={{ parameters.VTan }},
        hTan={{ parameters.hTan }},
        dIns={{ parameters.dIns }},
        pressureDriven=true,
        m_flow_nominal={{ parameters.nominal_mass_flow_radiator_loop }},
        y={{ element.name }}_control.y)
  variant: air_water_heat_pump

