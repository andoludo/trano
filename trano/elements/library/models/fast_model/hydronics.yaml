# Water circuits, in two modes chosen by the library:
# * FastModel (closed loop): the flows follow the pressures of the circuit (pressureDriven), the valves open as their
#   controllers decide (the controls of controls.yaml, connected through the port y), the pumps run on their curves;
# * FastModelMPC: the flow of each branch is set by its valve (the input <valve>_y, relative to the nominal flow),
#   the share of supply water by the three-way valves, the heat by the production (the input <production>_y); the
#   runnable model replays the column <system>_y of the external data, or holds the input at 1. These inputs are
#   signals of the data bus that no element writes, inputs of building_mpc (model_input).
# Ports with several connections are arrays, one element per connection, sized by the template.
- classes:
  - Radiator
  library: [FastModel, FastModelMPC]
  parameter_processing: &radiator_parameters
    function: default_parameters
  ports:
  - flow: convective
    medium: heat
    names:
    - heatPortCon
    targets:
    - Space
  - flow: radiative
    medium: heat
    names:
    - heatPortRad
    targets:
    - Space
  - flow: inlet
    medium: fluid
    names:
    - port_a[1]
  - flow: outlet
    medium: fluid
    names:
    - port_b[1]
  template: |-
    FastModel.Hydronics.Radiator {{ element.name }}(
        Q_flow_nominal={{ parameters.Q_flow_nominal }},
        T_a_nominal={{ parameters.T_a_nominal }},
        T_b_nominal={{ parameters.T_b_nominal }},
        TAir_nominal={{ parameters.TAir_nominal }},
        TRad_nominal={{ parameters.TRad_nominal }},
        n={{ parameters.n }},
        fraRad={{ parameters.fraRad }},
        nEle={{ parameters.nEle }},
        {%- if parameters.get('VWat') is not none %}
        VWat={{ parameters.VWat }},
        {%- endif %}
        {%- if parameters.get('mDry') is not none %}
        mDry={{ parameters.mDry }},
        {%- endif %}
        {%- if library == 'FastModel' %}
        pressureDriven=true,
        dp_nominal={{ parameters.dp_nominal }},
        {%- endif %}
        T_start=293.15)
  variant: default

# Ideal emitters (no water circuit): their emission control sets the share y of the nominal power (closed loop), or
# their heat flow rate, read from the data bus, between 0 and the nominal power, is an input (MPC).
- classes:
  - Radiator
  library: FastModel
  parameter_processing: *radiator_parameters
  ports: &ideal_ports
  - flow: convective
    medium: heat
    names:
    - heatPortCon
    targets:
    - Space
  - flow: radiative
    medium: heat
    names:
    - heatPortRad
    targets:
    - Space
  - flow: undirected
    medium: data
    names:
    - y
    targets:
    - Control
    no_check: true
  template: &ideal_template |-
    FastModel.HVAC.IdealHeater {{ element.name }}(Q_flow_nominal={{ parameters.Q_flow_nominal }}, fraRad={{ parameters.fraRad }}
        {%- if not element.control %}, y=1{% endif %})
  variant: ideal

- classes:
  - Radiator
  library: FastModel
  parameter_processing: *radiator_parameters
  ports: *ideal_ports
  template: *ideal_template
  variant: idealbus

- classes:
  - Radiator
  library: FastModelMPC
  component_template: &heat_flow_component
    bus:
      real_inputs:
      - component: ""
        name: Q_flow
        port: Q_flow
        target:
          main: element.name
        model_input:
          declaration: |-
            FastModel.Interfaces.HeatFlowInput {{ element.name }}_Q(Q_flow(min=0, max={{ parameters.Q_flow_nominal }}))
                "Heat flow rate of {{ element.name }}: input of the model";
          port: "{{ element.name }}_Q.Q_flow"
    category: control
    template: |-
      model IdealHeatingCooling{{ element.name | capitalize }}
        extends FastModel.HVAC.IdealHeatingCooling;
        {{ bus_template }}
      equation
        {{ bus_ports | safe }}
      end IdealHeatingCooling{{ element.name | capitalize }};
  parameter_processing: *radiator_parameters
  ports: &heat_flow_ports
  - flow: convective
    medium: heat
    names:
    - heatPortCon
    targets:
    - Space
  - flow: radiative
    medium: heat
    names:
    - heatPortRad
    targets:
    - Space
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - dataBus
    targets:
    - DataBus
    use_counter: false
  template: &heat_flow_template |-
    {{ package_name }}.Components.BaseClasses.IdealHeatingCooling{{ element.name | capitalize }} {{ element.name }}(fraRad={{ parameters.fraRad }})
  runnable: &heat_runnable
    declaration: |-
      {%- if element.name ~ '_Q' not in columns -%}
      Modelica.Blocks.Sources.Constant {{ element.name }}_Q(k=0) "No heat without external data";
      {%- endif -%}
    equation: |-
      {%- if element.name ~ '_Q' in columns -%}
      connect(data_bus.y[{{ columns.index(element.name ~ '_Q') + 1 }}], mpc.{{ element.name }}_Q.Q_flow);
      {%- else -%}
      connect({{ element.name }}_Q.y, mpc.{{ element.name }}_Q.Q_flow);
      {%- endif -%}
  variant: ideal

- classes:
  - Radiator
  library: FastModelMPC
  component_template: *heat_flow_component
  parameter_processing: *radiator_parameters
  ports: *heat_flow_ports
  template: *heat_flow_template
  runnable: *heat_runnable
  variant: idealbus

- classes:
