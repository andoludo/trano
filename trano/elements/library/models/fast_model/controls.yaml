# The controls of the systems are inputs of building_mpc (each system declares its own: <system>_y): the
# controllers of the other libraries have no FastModel component.
- classes:
  - EmissionControl
  library: [FastModel, FastModelMPC]
  parameter_processing: &no_parameters
    function: default_parameters
  ports: []
  template: ""
  variant: default
