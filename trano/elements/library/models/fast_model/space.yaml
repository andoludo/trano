# The FastModel library reuses the element definitions of the 'mpc' library (Library.element_library) and adds
# what it models beyond them. Its zones are not declared from these templates: trano.fast_model assembles them.

# The infiltration variant only changes the Buildings zone; the RC zones always count an air change
# rate and the multilayer zone reads `ach` from the space (0.15 ACH by default, as MixedAirInf).
- classes:
  - Space
  library: FastModel
  parameter_processing:
    function: default_parameters
  ports:
  - flow: undirected
    medium: data
    names:
    - weaBus
    targets:
    - Weather
  - flow: convective
    medium: heat
    names:
    - heaPorAir
    targets:
    - Emission
  - flow: undirected
    medium: data
    names:
    - intGai
    targets:
    - BaseOccupancy
  template: |
    {{package_name}}.Trano.MPC.Zones.R3C2 {{ element.name }}
  variant: infiltration
