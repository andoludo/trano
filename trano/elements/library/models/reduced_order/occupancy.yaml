# AixLib reduced-order zones scale their people gains themselves (specificPeople, heat per person,
# see the space template): the occupancy gives the occupied fraction of the people density, and
# no machine or lighting gains (the YAML description has none).
- classes:
  - Occupancy
  figures: []
  library: reduced_order
  parameter_processing:
    function: default_parameters
  ports:
  - flow: undirected
    medium: data
    names:
    - relativeGains
    targets:
    - Space
  template: |2-

        {{package_name}}.Trano.Occupancy.SimpleOccupancy
        {{ element.name }}({{ macros.render_parameters(parameters) | safe}})
  variant: default
