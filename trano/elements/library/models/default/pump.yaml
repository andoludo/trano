- classes:
  - Pump
  component_template:
    bus:
      real_inputs:
      - component: pumRad
        name: y
        port: y
        target:
          main: |-
            element.name
      real_outputs:
      - component: gain
        name: y_gain
        port: y
        target:
          main: |-
            element.name
      - component: pumRad
        name: power
        port: P
        power:
          energy: "Electricity"
        target:
          main: |-
            element.name
      - component: temSup
        name: T
        port: T
        target:
          main: element.control.name
    category: ventilation
    # constant_speed: the speed input of the mover is 1 (the nominal speed) instead of the control of the bus, whose
    # connection is left out (Buildings' preconfigured mover has a final continuous input). The newline after the
    # endif is doubled: the environment trims the first one after a block tag
    template: "\nmodel Pump{{ element.name | capitalize}}\nextends {{ package_name }}.Trano.Fluid.Ventilation.PartialPump;\n{{bus_template}}\nequation\n{% if element.parameters and (element.parameters.constant_speed | string | lower == 'true') %}{% for line in bus_ports.split('\\n') if not line.strip().endswith(', pumRad.y);') %}{{ line | safe }}\n{% endfor %}pumRad.y = 1;{% else %}{{bus_ports | safe}}{% endif %}\n\n end Pump{{ element.name | capitalize}};\n "
  figures: []
  library: default
  parameter_processing:
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
    use_counter: false
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
    use_counter: false
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - dataBus
    targets:
    - Control
    - DataBus
    use_counter: false
  template: |2-
      {{ package_name }}.Components.BaseClasses.Pump{{ element.name | capitalize }}
         {{ element.name }}(
         {{ macros.render_parameters(parameters) | safe}},
        redeclare package Medium = MediumW

        )
  variant: default
