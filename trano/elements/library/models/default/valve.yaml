- classes:
  - Valve
  figures:
  - left_axis:
      label: Valve control signal [-]
      lines:
      - label: Valve control signal [-]
        template: |-
          {{ element.name }}.y
  library: default
  parameter_processing:
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    names:
    - port_a
  - flow: outlet
    medium: fluid
    names:
    - port_b
  - flow: undirected
    medium: data
    names:
    - y
    targets:
    - Control
  template: |-
    {{ library_name }}.Fluid.Actuators.Valves.TwoWayEqualPercentage
            {{ element.name }}(
                {{ macros.render_parameters(parameters) | safe}},
    {%- if element.parameters.flow_coefficient_type %}
    CvData={{ library_name }}.Fluid.Types.CvTypes.{{ element.parameters.flow_coefficient_type }},
    {%- endif %}
    redeclare package Medium = MediumW

    ) "Radiator valve" 
  variant: default
