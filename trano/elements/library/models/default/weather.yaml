# TMY3 weather reader shared by the libraries deriving from IBPSA (Buildings, AixLib).
# IDEAS uses its own SimInfoManager (see models/ideas/weather.yaml).
- classes:
  - Weather
  figures: []
  library: default
  parameter_processing:
    function: default_parameters
  ports:
  - flow: undirected
    medium: weather_data
    multi_connection: true
    names:
    - weaBus
    targets:
    - Space
    - Boundary
    use_counter: false
  template: |2-

    {% if macros.render_parameters(parameters) | safe %}
    {{ library_name }}.BoundaryConditions.WeatherData.ReaderTMY3
                {{ element.name }}({{ macros.render_parameters(parameters) | safe}})
    {% else %}
    {{ library_name }}.BoundaryConditions.WeatherData.ReaderTMY3
                {{ element.name }}(filNam=Modelica.Utilities.Files.loadResource
        ("modelica://{{ library_name }}/Resources/weatherdata/USA_IL_Chicago-OHare.Intl.AP.725300_TMY3.mos"))
    {% endif %}
  variant: default
