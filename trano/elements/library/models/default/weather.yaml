# TMY3 weather reader shared by the libraries deriving from IBPSA (Buildings, AixLib).
# IDEAS uses its own SimInfoManager (see models/ideas/weather.yaml). Without a weather path both
# read the Uccle file IDEAS ships (the default of its SimInfoManager), so that a YAML gives the
# same climate whatever the library; every generated model loads IDEAS (the Trano package uses it).
- classes:
  - Weather
  figures: []
  library: default
  parameter_processing:
    function: default_parameters
  ports:
  - flow: undirected
    medium: weather_data
    multi_connection: true
    names:
    - weaBus
    targets:
    - Space
    - Boundary
    - FloorOnGround
    use_counter: false
  template: |2-

    {% if macros.render_parameters(parameters) | safe %}
    {{ library_name }}.BoundaryConditions.WeatherData.ReaderTMY3
                {{ element.name }}({{ macros.render_parameters(parameters) | safe}})
    {% else %}
    {{ library_name }}.BoundaryConditions.WeatherData.ReaderTMY3
                {{ element.name }}(filNam=Modelica.Utilities.Files.loadResource
        ("modelica://IDEAS/Resources/weatherdata/BEL_VLG_Uccle.064470_TMYx.2007-2021.mos"))
    {% endif %}
  variant: default
