- classes:
  - AirHandlingUnit
  component_template:
    bus:
      real_inputs: []
      real_outputs:
      - component: PEle
        name: power
        port: y
        power:
          energy: "Electricity"
        target:
          main: |-
            element.name
      - component: EEle
        name: electric_energy
        port: y
        target:
          main: |-
            element.name
      - component: PFan
        name: fan_power
        port: y
        target:
          main: |-
            element.name
      - component: EFan
        name: fan_energy
        port: y
        target:
          main: |-
            element.name
      - component: QRec
        name: recovered_heat_flow
        port: y
        target:
          main: |-
            element.name
      - component: TSup
        name: supply_temperature
        port: T
        target:
          main: |-
            element.name
      - component: TRet
        name: extract_temperature
        port: T
        target:
          main: |-
            element.name
      - component: PHea
        name: heater_power
        port: y
        target:
          main: |-
            element.name
      - component: EHea
        name: heater_energy
        port: y
        target:
          main: |-
            element.name
      - component: yByp
        name: bypass
        port: y
        target:
          main: |-
            element.name
    category: ventilation
    template: |-
      model SystemD{{ element.name | capitalize}}
      extends {{ package_name }}.Trano.Fluid.Ventilation.PartialSystemD;
      {{bus_template}}
      equation
      {{bus_ports | safe}}
      end SystemD{{ element.name | capitalize}};
  library: default
  parameter_processing:
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
    targets:
    - System
    - Space
    use_counter: false
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
    targets:
    - System
    - Space
    use_counter: false
  - flow: undirected
    medium: data
    names:
    - dataBus
    targets:
    - DataBus
  - flow: inlet_or_outlet
    medium: fluid
    names:
    - ports
    targets:
    - BaseBoundary
  template: |-
    {{package_name}}.Components.BaseClasses.SystemD{{ element.name | capitalize}}
        {{ element.name }}
        (redeclare package Medium = Medium, {{ macros.render_parameters(parameters) | safe}},
        usePostHeater={{ 'true' if element.parameters.supply_air_minimum_temperature is not none else 'false' }})
  variant: system_d

- classes:
  - AirHandlingUnit
  component_template:
    bus:
      real_inputs: []
      real_outputs:
      - component: PFan
        name: power
        port: y
        power:
          energy: "Electricity"
        target:
          main: |-
            element.name
      - component: EFan
        name: electric_energy
        port: y
        target:
          main: |-
            element.name
      - component: TSup
        name: supply_temperature
        port: T
        target:
          main: |-
            element.name
      - component: TRet
        name: extract_temperature
        port: T
        target:
          main: |-
            element.name
    category: ventilation
    template: |-
      model SystemC{{ element.name | capitalize}}
      extends {{ package_name }}.Trano.Fluid.Ventilation.PartialSystemC;
      {{bus_template}}
      equation
      {{bus_ports | safe}}
      end SystemC{{ element.name | capitalize}};
  library: default
  parameter_processing:
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
