    category: boiler
    template: "\n    model BoilerWithoutStorage{{ element.name | capitalize}}\n    extends\
      \ {{ package_name }}.Trano.Fluid.Boilers.PartialBoilerWithoutStorage;\n    {{bus_template}}\n\
      \    equation\n    {{bus_ports | safe}}\n     end BoilerWithoutStorage{{ element.name\
      \ | capitalize}};\n     "
  library: default
  parameter_processing:
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
    use_counter: false
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
    use_counter: false
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - dataBus
    targets:
    - Control
    - DataBus
    use_counter: false
  template: "\n{{package_name}}.Components.BaseClasses.\nBoilerWithoutStorage{{ element.name\
    \ | capitalize}} {{ element.name }}(\n{{ macros.render_parameters(parameters)\
    \ | safe}},\nredeclare package MediumW = MediumW, fue = Buildings.Fluid.Data.Fuels.{{ element.parameters.fuel or 'NaturalGasLowerHeatingValue' }}())\
    \ \"Boiler\" "
