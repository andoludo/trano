# Heat pumps of the ModularReversible family of Buildings on Trano.Fluid.Boilers.PartialModularHeatPump: the outdoor
# air, a ground loop or a water loop as source, a performance table or a Carnot model (heat_pump_data).
- classes:
  - Boiler
  component_template:
    bus: &heat_pump_bus
      real_inputs:
      # heat demand of the heating circuit (simple boiler control); always on when nothing drives it
      - component: pumpDemandSignal
        name: y
        port: u
        default: 1.0
        target:
          main: |-
            element.name
      real_outputs:
      - component: PEle
        name: power
        port: y
        power:
          energy: "Electricity"
        target:
          main: |-
            element.name
      - component: QHea
        name: heat_flow
        port: y
        target:
          main: |-
            element.name
      - component: EEle
        name: electric_energy
        port: y
        target:
          main: |-
            element.name
      - component: EHea
        name: heat_energy
        port: y
        target:
          main: |-
            element.name
      - component: COP
        name: cop
        port: y
        target:
          main: |-
            element.name
      - component: SCOP
        name: seasonal_cop
        port: y
        target:
          main: |-
            element.name
      - component: supTemp
        name: supply_temperature
        port: T
        target:
          main: |-
            element.name
      - component: retTemp
        name: return_temperature
        port: T
        target:
          main: |-
            element.name
      - component: TBuf
        name: buffer_temperature
        port: T
        target:
          main: |-
            element.name
      - component: TSouExp
        name: source_temperature
        port: y
        target:
          main: |-
            element.name
      - component: ySet
        name: compressor_speed
        port: y
        target:
          main: |-
            element.name
    category: boiler
    # the outdoor temperature comes from the weather data on the data bus
    template: |-
      model AirWaterHeatPump{{ element.name | capitalize}}
      extends {{ package_name }}.Trano.Fluid.Boilers.PartialModularHeatPump;
      {{bus_template}}
      equation
      {{bus_ports | safe}}
      connect(dataBus.TDryBul, TOut.u);
      end AirWaterHeatPump{{ element.name | capitalize}};
  library: default
  parameter_processing:
    function: default_parameters
  ports: &heat_pump_ports
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
    use_counter: false
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
    use_counter: false
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - dataBus
    targets:
    - Control
    - DataBus
    use_counter: false
  template: |-
    {{package_name}}.Components.BaseClasses.AirWaterHeatPump{{ element.name | capitalize}} {{ element.name }}(
    {{ macros.heat_pump(element, parameters, air=true) }},
    {{ macros.render_parameters(parameters) | safe}},
    redeclare package MediumW = MediumW, fue = Buildings.Fluid.Data.Fuels.{{ element.parameters.fuel or 'NaturalGasLowerHeatingValue' }}()) "Air-water heat pump"
  variant: air_water_heat_pump

- classes:
  - Boiler
  component_template:
    bus: *heat_pump_bus
    category: boiler
    # the ground loop: a brine (water) source whose temperature follows an annual sine; the outdoor air still
    # drives the heating curve and the heating season
    template: |-
      model GroundSourceHeatPump{{ element.name | capitalize}}
      extends {{ package_name }}.Trano.Fluid.Boilers.PartialModularHeatPump(
        redeclare package MediumSou = Buildings.Media.Water,
        useOutdoorAirSource=false,
        useGroundSource=true);
      {{bus_template}}
      equation
      {{bus_ports | safe}}
      connect(dataBus.TDryBul, TOut.u);
      end GroundSourceHeatPump{{ element.name | capitalize}};
  library: default
  parameter_processing:
    function: default_parameters
  ports: *heat_pump_ports
  template: |-
    {{package_name}}.Components.BaseClasses.GroundSourceHeatPump{{ element.name | capitalize}} {{ element.name }}(
    {{ macros.heat_pump(element, parameters, air=false) }},
    {{ macros.render_parameters(parameters) | safe}},
    redeclare package MediumW = MediumW, fue = Buildings.Fluid.Data.Fuels.{{ element.parameters.fuel or 'NaturalGasLowerHeatingValue' }}()) "Ground-source heat pump"
  variant: ground_source_heat_pump

- classes:
  - Boiler
  component_template:
    bus: *heat_pump_bus
    category: boiler
    # a water loop at the constant temperature_heatpump_source (a well, a river or a waste heat loop)
    template: |-
      model WaterWaterHeatPump{{ element.name | capitalize}}
      extends {{ package_name }}.Trano.Fluid.Boilers.PartialModularHeatPump(
        redeclare package MediumSou = Buildings.Media.Water,
        useOutdoorAirSource=false,
        useGroundSource=false);
      {{bus_template}}
      equation
      {{bus_ports | safe}}
      connect(dataBus.TDryBul, TOut.u);
      end WaterWaterHeatPump{{ element.name | capitalize}};
  library: default
  parameter_processing:
    function: default_parameters
  ports: *heat_pump_ports
  template: |-
    {{package_name}}.Components.BaseClasses.WaterWaterHeatPump{{ element.name | capitalize}} {{ element.name }}(
    {{ macros.heat_pump(element, parameters, air=false) }},
    {{ macros.render_parameters(parameters) | safe}},
    redeclare package MediumW = MediumW, fue = Buildings.Fluid.Data.Fuels.{{ element.parameters.fuel or 'NaturalGasLowerHeatingValue' }}()) "Water-water heat pump"
  variant: water_water_heat_pump
