        port: u
        default: 1.0
        target:
          main: |-
            element.name
      real_outputs:
        - component: QFue
          name: fuel_power
          port: y
          power:
            energy: "Gas"
          target:
            main: |-
              element.name
        - component: QHea
          name: heat_flow
          port: y
          target:
            main: |-
              element.name
        - component: EFue
          name: fuel_energy
          port: y
          target:
            main: |-
              element.name
        - component: EHea
          name: heat_energy
          port: y
          target:
            main: |-
              element.name
        - component: GasUsage
          name: gas_usage
          port: y
          target:
            main: |-
              element.name
        - component: TSupply
          name: supply_temperature
          port: T
          target:
            main: |-
              element.name
        - component: TReturn
          name: return_temperature
          port: T
          target:
            main: |-
              element.name
        - component: senVolFlo
          name: m_flow
          port: V_flow
          target:
            main: |-
