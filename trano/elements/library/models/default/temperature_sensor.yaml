- classes:
  - TemperatureSensor
  figures: []
  library: default
  parameter_processing:
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
    use_counter: false
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
    use_counter: false
  - flow: undirected
    medium: data
    names:
    - T
    targets:
    - Control
    - HeatMeterSensor
  template: |2-
        Buildings.Fluid.Sensors.TemperatureTwoPort {{ element.name }}(
        redeclare package Medium = MediumW,
        {{ macros.render_parameters(parameters) | safe }})
  variant: default
