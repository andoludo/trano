# Same weather reader and weather file as the Buildings library. The path is quoted so that the
# generated model is valid Modelica without going through the simulation helpers.
- classes:
  - Weather
  figures: []
  library: mpc
  parameter_processing:
    function: default_parameters
  ports:
  - flow: undirected
    medium: weather_data
    multi_connection: true
    names:
    - weaBus
    targets:
    - Space
    - Boundary
    use_counter: false
  template: |
    {% set path = parameters.get("filNam") %}
    {% if path %}
    Buildings.BoundaryConditions.WeatherData.ReaderTMY3 {{ element.name }}(filNam={{ (path if path.startswith('"') else '"' ~ path ~ '"') | safe }})
    {% else %}
    Buildings.BoundaryConditions.WeatherData.ReaderTMY3 {{ element.name }}(filNam=Modelica.Utilities.Files.loadResource("modelica://Buildings/Resources/weatherdata/USA_IL_Chicago-OHare.Intl.AP.725300_TMY3.mos"))
    {% endif %}
  variant: default
