# Same weather reader and weather file as the Buildings library (the Uccle file of IDEAS when the YAML
# gives none, which every generated model loads). A file path is quoted so that the
# generated model is valid Modelica without going through the simulation helpers; a Modelica
# expression (Modelica.Utilities.Files.loadResource(...)) is kept as it is.
- classes:
  - Weather
  figures: []
  library: mpc
  parameter_processing:
    function: default_parameters
  ports:
  - flow: undirected
    medium: weather_data
    multi_connection: true
    names:
    - weaBus
    targets:
    - Space
    - Boundary
    use_counter: false
  template: |
    {% set path = parameters.get("filNam") %}
    {% if path %}
    Buildings.BoundaryConditions.WeatherData.ReaderTMY3 {{ element.name }}(filNam={{ (path if path.startswith('"') or path.startswith('Modelica.') else '"' ~ path ~ '"') | safe }})
    {% else %}
    Buildings.BoundaryConditions.WeatherData.ReaderTMY3 {{ element.name }}(filNam=Modelica.Utilities.Files.loadResource("modelica://IDEAS/Resources/weatherdata/BEL_VLG_Uccle.064470_TMYx.2007-2021.mos"))
    {% endif %}
  variant: default
