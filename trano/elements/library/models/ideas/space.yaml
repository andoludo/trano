# IDEAS zone definitions. The `infiltration` variant renders the same component as the
# default one (the infiltration variant sets n50 from the air change rate); both share the definitions below.
- classes:
  - Space
  figures: &ideas_zone_figures
  - left_axis:
      label: Zone air temperature [K]
      lines:
      - color: blue
        label: Air temperature [K]
        template: '{{ element.name }}.TSensor'
      - color: black
        label: Measured Air temperature [K]
        line_width: 2.0
        template: data_bus.dataBus.T{{ element.name | capitalize}}
    right_axis:
      label: Occupancy schedule [-]
      lines:
      - label: Occupied zone [-]
        line_style: dashed
        template: '{{ element.occupancy.name }}.occSch2.occupied'
  - left_axis:
      label: Heat flow rate [W]
      lines:
      - color: red
        label: Radiative heat flow rate [W]
        template: '{{ element.name }}.heaPorRad.Q_flow'
      - color: blue
        label: Convective heat flow rate [W]
        template: '{{ element.name }}.heaPorAir.Q_flow'
      - color: yellow
        label: Latent heat gain [W]
        template: '{{ element.name }}.air.QLat_flow'
      - label: Convective heat gain [W]
        template: '{{ element.name }}.air.QCon_flow'
  - left_axis:
      label: Control signal [-]
      lines:
      - label: Control signal [-]
        line_style: dashed
        template: '{{ element.emissions[0].control.name  }}.y'
    right_axis:
      label: Zone controller input [K]
      lines:
      - color: blue
        label: Zone controller setpoint [K]
        template: '{{ element.emissions[0].control.name }}.emissionControl.conHea.u_s'
      - color: red
        label: Zone controller measured [K]
        template: '{{ element.emissions[0].control.name }}.emissionControl.conHea.u_m'
  library: ideas
  parameter_processing: &ideas_zone_parameters
    function: modify_alias
    parameter:
      average_room_height: hZone
      volume: V
      sensible_thermal_mass_scaling_factor: mSenFac
      temperature_initial: T_start
  ports: &ideas_zone_ports
  - bus_connection: true
    flow: undirected
    medium: data
    multi_connection: true
    names:
    - propsBus
    targets:
    - BaseWall
  - flow: undirected
    medium: data
    names:
    - yOcc
    targets:
    - BaseOccupancy
  - flow: convective
    medium: heat
    names:
    - gainCon
    targets:
    - Emission
  - flow: radiative
    medium: heat
    names:
    - gainRad
    targets:
    - Emission
  - flow: convective
    medium: heat
    multi_connection: true
    names:
    - gainCon
    targets:
    - VAVControl
    - DataBus
    use_counter: false
  - flow: inlet_or_outlet
    medium: fluid
    multi_connection: true
    names:
    - ports
    targets:
    - Ventilation
    - Control
    - DataBus
  template: &ideas_zone_template |-
    IDEAS.Buildings.Components.Zone {{ element.name }}(
            {%- if element.number_ventilation_ports != 0 -%}
        nPorts = {{ element.number_ventilation_ports }},
        {%- endif %}
        {{ macros.render_parameters(parameters) | safe}},
        {%- if element.variant == "infiltration" and element.parameters.ach is not none %}
        n50={{ element.parameters.ach }}*{{ element.name }}.n50toAch,
        {%- endif %}
        redeclare package Medium = Medium,
    {% if element.occupancy %}
        redeclare IDEAS.Buildings.Components.Occupants.AreaWeightedInput occNum,
        occTyp(
          QsenPp={{ element.occupancy.gains_per_person.sensible }},
          QlatPp={{ element.occupancy.gains_per_person.latent }},
          radFra={{ element.occupancy.gains_per_person.radiant_fraction | round(6) }}),
    {% endif %}
        nSurf={{ element.number_merged_external_boundaries }})
  variant: default

- classes:
  - Space
  figures: *ideas_zone_figures
  library: ideas
  parameter_processing: *ideas_zone_parameters
  ports: *ideas_zone_ports
  template: *ideas_zone_template
  variant: infiltration

# Envelope rendered with IDEAS' RectangularZoneTemplate: the zone, its four vertical faces,
# floor and ceiling (one construction and one window each) are a single component. Surfaces
# that do not fit the rectangle and the internal walls connect through `proBusExt`.
- classes:
  - Space
  figures: *ideas_zone_figures
  library: ideas
  parameter_processing:
    function: modify_alias
    parameter:
      average_room_height: h
      floor_area: AZone
      sensible_thermal_mass_scaling_factor: mSenFac
      temperature_initial: T_start
  ports:
  - bus_connection: true
    flow: undirected
    medium: data
    multi_connection: true
    names:
    - proBusExt
    targets:
    - BaseWall
  - flow: undirected
    medium: data
    names:
    - yOcc
    targets:
    - BaseOccupancy
  - flow: convective
    medium: heat
    names:
    - gainCon
    targets:
    - Emission
  - flow: radiative
    medium: heat
    names:
    - gainRad
    targets:
    - Emission
  - flow: convective
    medium: heat
    multi_connection: true
    names:
    - gainCon
    targets:
    - VAVControl
    - DataBus
    use_counter: false
  - flow: inlet_or_outlet
    medium: fluid
    multi_connection: true
    names:
    - ports
    targets:
    - Ventilation
    - Control
    - DataBus
  template: |-
    {% set zone = element.rectangular_zone %}
    IDEAS.Buildings.Components.RectangularZoneTemplate {{ element.name }}(
            {%- if element.number_ventilation_ports != 0 -%}
        nPorts = {{ element.number_ventilation_ports }},
        {%- endif %}
        {{ macros.render_parameters(parameters) | safe}},
        redeclare package Medium = Medium,
    {% if element.occupancy %}
        redeclare IDEAS.Buildings.Components.Occupants.AreaWeightedInput occNum,
        occTyp(
          QsenPp={{ element.occupancy.gains_per_person.sensible }},
          QlatPp={{ element.occupancy.gains_per_person.latent }},
          radFra={{ element.occupancy.gains_per_person.radiant_fraction | round(6) }}),
    {% endif %}
        aziA={{ zone.azimuth }},
        l={{ zone.length }},
        w={{ zone.width }},
        ACei={{ zone.ceiling_area }},
    {% for face in zone.faces %}
        bouTyp{{ face.key }}=IDEAS.Buildings.Components.Interfaces.BoundaryType.{{ face.boundary_type }},
    {% if face.construction %}
        redeclare parameter {{ package_name }}.Data.Constructions.{{ face.construction.name }} conTyp{{ face.key }},
    {% endif %}
    {% if face.length %}
        l{{ face.key }}={{ face.length }},
    {% endif %}
    {% if face.window %}
        hasWin{{ face.key }}=true,
        A_win{{ face.key }}={{ face.window.area }},
        redeclare {{ package_name }}.Data.Glazing.{{ face.window.glazing.name }} glazing{{ face.key }},
    {% endif %}
    {% endfor %}
        nSurfExt={{ element.number_merged_external_boundaries }})
  variant: rectangular_zone
