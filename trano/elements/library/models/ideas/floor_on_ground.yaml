- classes:
  - FloorOnGround
  figures: []
  library: ideas
  parameter_processing:
    function: default_parameters
  ports:
  - flow: undirected
    medium: data
    names:
    - propsBus_a
    targets:
    - Space
  template: |2-

        IDEAS.Buildings.Components.SlabOnGround {{ element.name }}(
        redeclare parameter {{ package_name }}.Data.Constructions.
        {{ element.construction.name }} constructionType,
        redeclare package Medium = Medium,
        A={{  element.surface}})
  variant: default

# A raised floor over outdoor air (ASHRAE 140): the outer surface follows the outdoor dry-bulb temperature.
- classes:
  - FloorOnGround
  figures: []
  library: ideas
  parameter_processing:
    function: default_parameters
  ports:
  - flow: undirected
    medium: data
    names:
    - propsBus_a
    targets:
    - Space
  template: |2-

        {{ package_name }}.Trano.ThermalZones.BoundaryWallOutdoorAir {{ element.name }}(
        redeclare parameter {{ package_name }}.Data.Constructions.
        {{ element.construction.name }} constructionType,
        redeclare package Medium = Medium,
        inc=IDEAS.Types.Tilt.Floor,
        azi=0,
        A={{  element.surface}})
  variant: outdoor_air
