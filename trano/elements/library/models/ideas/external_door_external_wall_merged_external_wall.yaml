- classes:
  - ExternalWall
  - MergedExternalWall
  - ExternalDoor
  figures: []
  library: ideas
  parameter_processing:
    function: default_parameters
  ports:
  - bus_connection: true
    flow: undirected
    medium: data
    multi_connection: true
    multi_object: true
    names:
    - propsBus_a
    targets:
    - Space
  template: |2-

        IDEAS.Buildings.Components.OuterWall[{{ element.surfaces | length }}]
        {{ element.name }}(
        redeclare parameter {{ package_name }}.Data.Constructions.
        {{ element.constructions[0].name }}
        constructionType,
        A={{  macros.join_list(element.surfaces)}},
        final azi={{macros.join_list(element.azimuths)}},
        redeclare package Medium = Medium,
        each coeffsCp={{ element.name }}[1].Cp_table.{{ element.wind_pressure_table }},
        final inc={{ macros.convert_tilts(element.tilts, library_name) }})
  variant: default
