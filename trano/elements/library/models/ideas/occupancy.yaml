# IDEAS zones take the number of occupants: the occupancy outputs the occupant density, which the
# zone multiplies by its floor area (Occupants.AreaWeightedInput). The heat released per person
# comes from the occupancy gains through the zone's occupancy type (see the IDEAS space template).
- classes:
  - Occupancy
  component_template:
    bus:
      integer_outputs:
      - component: occSch2
        name: Occupied
        port: occupied
        target:
          main: element.space_name
    category: control
    template: "\nmodel Occupancy{{ element.name | capitalize}}\nextends {{ package_name\
      \ }}.Trano.Occupancy.SimpleOccupancy ;\n{{bus_template}}\nequation\n{{bus_ports\
      \ | safe}}\n end Occupancy{{ element.name | capitalize}};\n "
  figures: []
  library: ideas
  parameter_processing:
    function: default_parameters
  ports: &ideas_occupancy_ports
  - flow: undirected
    medium: data
    names:
    - occupantDensity
    targets:
    - Space
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - dataBus
    targets:
    - DataBus
    use_counter: false
  template: &ideas_occupancy_template |2-

        {{package_name}}.Components.BaseClasses.Occupancy{{ element.name | capitalize}}
        {{ element.name }}({{ macros.render_parameters(parameters) | safe}})
  variant: default

- classes:
  - Occupancy
  component_template:
    bus:
      real_inputs:
        - component: co2
          name: DataSource
          port: u
          target:
            main: DataSource
    category: control
    template: "\nmodel Occupancy{{ element.name | capitalize}}\nextends {{ package_name\
      \ }}.Trano.Occupancy.OccupancyCo2 ;\n{{bus_template}}\nequation\n{{bus_ports\
      \ | safe}}\n end Occupancy{{ element.name | capitalize}};\n "
  figures: []
  library: ideas
  parameter_processing:
    function: default_parameters
  ports: *ideas_occupancy_ports
  template: *ideas_occupancy_template
  variant: co2
