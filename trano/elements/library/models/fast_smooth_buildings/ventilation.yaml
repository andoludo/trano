# Balanced ventilation with heat recovery (trano's system D): the unit sets the relative speed of its fans, the
# input <unit>_y (held at 1, the design flow, by its bounds: without an indoor air quality model an optimizer
# would stop the ventilation); each duct carries y times its nominal flow. The outdoor air: the weather of the data bus.
- classes:
  - Duct
  library: [FastSmoothBuildings, FastSmoothBuildingsMPC]
  parameter_processing:
    function: default_parameters
  ports:
  - flow: inlet
    medium: fluid
    names:
    - port_a[1]
  - flow: outlet
    medium: fluid
    names:
    - port_b[1]
  template: |-
    FastSmoothBuildings.Ventilation.Duct {{ element.name }}(m_flow_nominal={{ parameters.m_flow_nominal }})
  variant: default

- classes:
  - AirHandlingUnit
  library: FastSmoothBuildings
  component_template: &unit_component
    bus:
      real_inputs:
      - component: weaBus
        name: TDryBul
        port: TDryBul
        target:
          main: element
      - component: weaBus
        name: TBlaSky
        port: TBlaSky
        target:
          main: element
      - component: weaBus
        name: winSpe
        port: winSpe
        target:
          main: element
      - component: weaBus
        name: winDir
        port: winDir
        target:
          main: element
      - component: weaBus
        name: HDirNor
        port: HDirNor
        target:
          main: element
      - component: weaBus
        name: HDifHor
        port: HDifHor
        target:
          main: element
      - component: weaBus
        name: HGloHor
        port: HGloHor
        target:
          main: element
      - component: weaBus
        name: lat
        port: lat
        target:
          main: element
      - component: weaBus
        name: decAng
        port: decAng
        target:
          main: element
      - component: weaBus
        name: solHouAng
        port: solHouAng
        target:
          main: element
      - component: weaBus
        name: cosZen
        port: cosZen
        target:
          main: element
      - component: weaBus
        name: F1
        port: F1
        target:
          main: element
      - component: weaBus
        name: F2
        port: F2
        target:
          main: element
      - component: weaBus
        name: pAtm
        port: pAtm
        target:
          main: element
    category: ventilation
    template: &unit_wrapper |-
      model HeatRecoveryUnit{{ element.name | capitalize }}
        extends FastSmoothBuildings.Ventilation.HeatRecoveryUnit;
        {{ bus_template }}
      equation
        {{ bus_ports | safe }}
      end HeatRecoveryUnit{{ element.name | capitalize }};
  parameter_processing: &unit_parameters
    function: default_parameters
  ports: &unit_ports
  - flow: inlet
    medium: fluid
    multi_connection: true
    names:
    - port_a
    targets:
    - System
    - Space
  - flow: outlet
    medium: fluid
    multi_connection: true
    names:
    - port_b
    targets:
    - System
    - Space
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - dataBus
    targets:
    - DataBus
    use_counter: false
  template: &unit_template |-
    {%- if element.parameters.summer_bypass | string | lower == 'true' -%}
    {{ unsupported('Ventilation ' ~ element.name ~ ': the heat recovery unit of the FastSmoothBuildings library has no summer bypass.') }}
    {%- endif -%}
    {%- if element.parameters.supply_air_minimum_temperature is not none -%}
    {{ unsupported('Ventilation ' ~ element.name ~ ': the heat recovery unit of the FastSmoothBuildings library has no post-heater.') }}
    {%- endif -%}
    {%- if library == 'FastSmoothBuildings' and element.parameters.fan_schedule is not none %}
    Modelica.Blocks.Sources.CombiTimeTable {{ element.name }}_sch(
        table={{ element.parameters.fan_schedule }},
        extrapolation=Modelica.Blocks.Types.Extrapolation.Periodic,
        smoothness=Modelica.Blocks.Types.Smoothness.ConstantSegments) "Fan schedule of {{ element.name }}";
    {%- endif %}
    {{ package_name }}.Components.BaseClasses.HeatRecoveryUnit{{ element.name | capitalize }} {{ element.name }}(
        nPorts_a={{ macros.connections(element, 'port_a') }},
        nPorts_b={{ macros.connections(element, 'port_b') }},
        m_flow_nominal={{ parameters.m_flow_nominal }},
        eps={{ parameters.eps }},
        dpSup_nominal={{ parameters.dpSup_nominal if parameters.dpSup_nominal is defined else parameters.dp_nominal }},
        dpRet_nominal={{ parameters.dpRet_nominal if parameters.dpRet_nominal is defined else parameters.dp_nominal }}
        {%- if library == 'FastSmoothBuildings' %},
        y={{ element.name ~ '_sch.y[1]' if element.parameters.fan_schedule is not none else 1 }}{% endif %})
  variant: system_d

- classes:
  - AirHandlingUnit
  library: FastSmoothBuildingsMPC
  component_template:
    bus:
      real_inputs:
      - component: weaBus
        name: TDryBul
        port: TDryBul
        target:
          main: element
      - component: weaBus
        name: TBlaSky
        port: TBlaSky
        target:
          main: element
      - component: weaBus
        name: winSpe
        port: winSpe
        target:
          main: element
      - component: weaBus
        name: winDir
        port: winDir
        target:
          main: element
      - component: weaBus
        name: HDirNor
        port: HDirNor
        target:
          main: element
      - component: weaBus
        name: HDifHor
        port: HDifHor
        target:
          main: element
      - component: weaBus
        name: HGloHor
        port: HGloHor
        target:
          main: element
      - component: weaBus
        name: lat
        port: lat
        target:
          main: element
      - component: weaBus
        name: decAng
        port: decAng
        target:
          main: element
      - component: weaBus
        name: solHouAng
        port: solHouAng
        target:
          main: element
      - component: weaBus
        name: cosZen
        port: cosZen
        target:
          main: element
      - component: weaBus
        name: F1
        port: F1
        target:
          main: element
      - component: weaBus
        name: F2
        port: F2
        target:
          main: element
      - component: weaBus
        name: pAtm
        port: pAtm
        target:
          main: element
      - component: ""
        name: y
        port: y
        target:
          main: element.name
        model_input:
          declaration: |-
            FastSmoothBuildings.Interfaces.ControlInput {{ element.name }}_y(y(min=1, max=1)) "Fan speed of {{ element.name }} relative to the design flow: input of the model";
          port: "{{ element.name }}_y.y"
    category: ventilation
    template: *unit_wrapper
  parameter_processing: *unit_parameters
  ports: *unit_ports
  template: *unit_template
  runnable:
    declaration: |-
      {%- if element.name ~ '_y' not in columns -%}
      Modelica.Blocks.Sources.Constant {{ element.name }}_y(k=1) "Control held without external data";
      {%- endif -%}
    equation: |-
      {%- if element.name ~ '_y' in columns -%}
      connect(data_bus.y[{{ columns.index(element.name ~ '_y') + 1 }}], mpc.{{ element.name }}_y.y);
      {%- else -%}
      connect({{ element.name }}_y.y, mpc.{{ element.name }}_y.y);
      {%- endif -%}
  variant: system_d

- classes:
  - AirHandlingUnit
  library: [FastSmoothBuildings, FastSmoothBuildingsMPC]
  parameter_processing: *unit_parameters
  ports: *unit_ports
  template: |-
    {{ unsupported('Ventilation ' ~ element.name ~ ' (system_c): the FastSmoothBuildings library models balanced ventilation with heat recovery (system_d).') }}
  variant: system_c
