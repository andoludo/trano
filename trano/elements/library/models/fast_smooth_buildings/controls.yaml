# Controls. FastSmoothBuildings (closed loop): the controllers of trano's Buildings models without events
# (FastSmoothBuildings.Controls); an emission control reads the air temperature of its zone on the data bus (TZon<zone>) and
# drives its valve or ideal emitter through the port y, whose opening it writes on the data bus (y<valve>) for the
# collector control of the circuit; a three-way valve control reads its temperature sensor through the port u; the
# collector control writes the largest opening of its valves (yMax<control>) for the boiler control, and is referenced
# by the pump it drives, as the boiler control by its production. FastSmoothBuildingsMPC: no controller, the controls are
# inputs of building_mpc.
- classes:
  - EmissionControl
  library: FastSmoothBuildingsMPC
  parameter_processing: &no_parameters
    function: default_parameters
  ports: []
  template: ""
  variant: default
- classes:
  - EmissionControl
  library: FastSmoothBuildingsMPC
  parameter_processing: *no_parameters
  ports: []
  template: ""
  variant: onoff
- classes:
  - EmissionControl
  library: FastSmoothBuildingsMPC
  parameter_processing: *no_parameters
  ports: []
  template: ""
  variant: PController
- classes:
  - EmissionControl
  library: FastSmoothBuildingsMPC
  parameter_processing: *no_parameters
  ports: []
  template: ""
  variant: MonitoredSetpoint
- classes:
  - BoilerControl
  library: FastSmoothBuildingsMPC
  parameter_processing: *no_parameters
  ports: []
  template: ""
  variant: default
- classes:
  - BoilerControl
  library: FastSmoothBuildingsMPC
  parameter_processing: *no_parameters
  ports: []
  template: ""
  variant: complex
- classes:
  - BoilerControl
  library: FastSmoothBuildingsMPC
  parameter_processing: *no_parameters
  ports: []
  template: ""
  variant: simple
- classes:
  - ThreeWayValveControl
  - CollectorControl
  - AhuControl
  library: FastSmoothBuildingsMPC
  parameter_processing: *no_parameters
  ports: []
  template: ""
  variant: default

# Closed loop
- classes:
  - EmissionControl
  library: FastSmoothBuildings
  parameter_processing: &emission_parameters
    function: default_parameters
  ports: &emission_ports
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - y
    targets:
    - System
    use_counter: false
  - flow: undirected
    medium: data
    multi_connection: true
    names:
    - dataBus
    targets:
    - DataBus
    use_counter: false
  component_template:
    bus:
      real_inputs:
      - component: ""
        name: TZon
        port: TZon
        target:
          main: element.space_name
      real_outputs:
      - component: ""
        name: y
        port: y
        target:
          main: element.controllable_element.name
    category: control
    template: |-
      model EmissionPI{{ element.name | capitalize }}
        extends FastSmoothBuildings.Controls.EmissionPI;
        {{ bus_template }}
      equation
        {{ bus_ports | safe }}
      end EmissionPI{{ element.name | capitalize }};
  template: |-
    {{ package_name }}.Components.BaseClasses.EmissionPI{{ element.name | capitalize }} {{ element.name }}(
        schedule={{ parameters.schedule }},
        THeaSet={{ parameters.THeaSet }},
        THeaSetBack={{ parameters.THeaSetBack }})
  variant: default
