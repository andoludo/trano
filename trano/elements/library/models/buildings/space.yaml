# Buildings zone definitions. The `infiltration` variant uses Trano's MixedAirInf, a copy of
# Buildings.ThermalZones.Detailed.MixedAir with an infiltration air flow; everything else is shared.
- classes:
  - Space
  figures: &buildings_zone_figures
  - left_axis:
      label: Zone air temperature [K]
      lines:
      - color: blue
        label: Air temperature [K]
        template: '{{ element.name }}.air.vol.T'
      - color: black
        label: Measured Air temperature [K]
        line_width: 2.0
        template: data_bus.dataBus.T{{ element.name | capitalize}}
    right_axis:
      label: Occupancy schedule [-]
      lines:
      - label: Occupied zone [-]
        line_style: dashed
        template: '{{ element.occupancy.name }}.occSch2.occupied'
  - left_axis:
      label: Heat flow rate [W]
      lines:
      - color: red
        label: Radiative heat flow rate [W]
        template: '{{ element.name }}.heaPorRad.Q_flow'
      - color: blue
        label: Convective heat flow rate [W]
        template: '{{ element.name }}.heaPorAir.Q_flow'
      - color: yellow
        label: Latent heat gain [W]
        template: '{{ element.name }}.air.QLat_flow'
      - label: Convective heat gain [W]
        template: '{{ element.name }}.air.QCon_flow'
  - left_axis:
      label: Control signal [-]
      lines:
      - label: Control signal [-]
        line_style: dashed
        template: '{{ element.emissions[0].control.name  }}.y'
    right_axis:
      label: Zone controller input [K]
      lines:
      - color: blue
        label: Zone controller setpoint [K]
        template: '{{ element.emissions[0].control.name }}.emissionControl.conHea.u_s'
      - color: red
        label: Zone controller measured [K]
        template: '{{ element.emissions[0].control.name }}.emissionControl.conHea.u_m'
  library: buildings
  requires_occupancy: true
  parameter_processing: &buildings_zone_parameters
    function: exclude_parameters
    parameter:
    - volume
  ports: &buildings_zone_ports
  - flow: interchangeable_port
    medium: heat
    multi_connection: true
    names:
    - surf_surBou
    targets:
    - BaseInternalElement
  - flow: interchangeable_port
    medium: heat
    multi_connection: true
    names:
    - surf_conBou
    targets:
    - FloorOnGround
  - flow: undirected
    medium: data
    names:
    - qGai_flow
    targets:
    - BaseOccupancy
  - flow: undirected
    medium: weather_data
    names:
    - weaBus
    targets:
    - BaseWeather
  - flow: radiative
    medium: heat
    names:
    - heaPorRad
    targets:
    - Emission
  - flow: convective
    medium: heat
    multi_connection: true
    names:
    - heaPorAir
    targets:
    - Emission
    use_counter: false
  - flow: convective
    medium: heat
    names:
    - heaPorAir
    targets:
    - DataBus
  - flow: convective
    medium: heat
    names:
    - heaPorAir
    targets:
    - VAVControl
  - flow: inlet_or_outlet
    medium: fluid
    multi_connection: true
    names:
    - ports
    targets:
    - Ventilation
    - Control
    - DataBus
  template: &buildings_zone_template |-
    {%- if element.variant == "infiltration" -%}
    Trano.ThermalZones.MixedAirInf
    {%- else -%}
    Buildings.ThermalZones.Detailed.MixedAir
    {%- endif %} {{ element.name }}(
            redeclare package Medium = Medium,
            {{ macros.render_parameters(parameters) | safe}},
            {%- if element.number_ventilation_ports != 0 -%}
            nPorts = {{ element.number_ventilation_ports }},
            {%- endif %}
            {%- for boundary in element.boundaries -%}
                {%- if boundary.type == 'ExternalWall' -%}
                    {%- if boundary.number %}
                        nConExt={{ boundary.number }},
                        datConExt(
                        {{ macros.element_parameters(boundary) }},
                        azi={{ macros.join_list(boundary.azimuths) }}),
                    {% else %}
                        nConExt=0,
                    {%- endif %}
                {%- endif %}
                {%- if boundary.type == "InternalElement"-%}
                    {%- if boundary.number %}
                        nSurBou={{ boundary.number }},
                        surBou(
                        A={{ macros.join_list(boundary.surfaces) }},
                        til={{ macros.convert_tilts(boundary.tilts) }}),
                    {% else %}
                        nSurBou=0,
                    {%- endif %}
                {%- endif %}
                {%- if boundary.type == "WindowedWall" -%}
                    {%- if boundary.number %}
                        nConExtWin={{ boundary.number }},
                        datConExtWin(
                        {{ macros.element_parameters(boundary) }},
                        glaSys={{ macros.join_list(boundary.window_layers) }},
                        wWin={{ macros.join_list(boundary.window_width) }},
                        hWin={{ macros.join_list(boundary.window_height) }},
                        fFra={{ macros.join_list(boundary.window_frame_fraction) }},
                        {%- if boundary.has_shading %}
                        ove(wL={{ macros.join_list(boundary.overhang_width_left) }},
                            wR={{ macros.join_list(boundary.overhang_width_right) }},
                            dep={{ macros.join_list(boundary.overhang_depth) }},
                            gap={{ macros.join_list(boundary.overhang_gap) }}),
                        sidFin(h={{ macros.join_list(boundary.side_fin_height) }},
                            dep={{ macros.join_list(boundary.side_fin_depth) }},
                            gap={{ macros.join_list(boundary.side_fin_gap) }}),
                        {%- endif %}
                        azi={{ macros.join_list(boundary.azimuths) }}),
                    {% else %}
                        nConExtWin=0,
                    {%- endif %}
                {%- endif %}
                {%- if boundary.type == "FloorOnGround" -%}
                    {#- The outer surface is held at the ground temperature (floor_on_ground.yaml): no state there. -#}
                    {%- if boundary.number %}
                        nConBou={{ boundary.number }},
                        datConBou(
                        {{ macros.element_parameters(boundary) }},
                        azi={{ macros.join_list(boundary.azimuths) }},
                        each stateAtSurface_a=false),
                    {% else %}
                        nConBou=0,
                    {%- endif %}
                {%- endif %}
            {%- endfor %}
            nConPar=0,
            energyDynamics=Modelica.Fluid.Types.Dynamics.FixedInitial)
  variant: default

- classes:
  - Space
  figures: []
  library: buildings
  requires_occupancy: true
  parameter_processing: *buildings_zone_parameters
  ports: *buildings_zone_ports
  template: *buildings_zone_template
  variant: infiltration
