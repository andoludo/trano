# The floor construction is part of the zone (datConBou); this boundary holds its outer surface
# at the ground temperature. Without it the zone's surf_conBou port is left open and the floor
# is adiabatic. A prescribed surface temperature cannot also be an initialized state, so the zone
# renders these constructions with stateAtSurface_a=false (as Buildings' OnlyConstructionBoundary).
- classes:
  - FloorOnGround
  figures: []
  library: buildings
  parameter_processing:
    function: default_parameters
  ports:
  - flow: interchangeable_port
    medium: heat
    names:
    - port
    targets:
    - Space
  template: |2-
        Buildings.HeatTransfer.Sources.FixedTemperature {{ element.name }}(T={{ element.ground_temperature }})
        "Ground under the floor"
  variant: default
