- classes:
  - Space
  library: iso_13790
  parameter_processing:
    function: modify_alias
    parameter:
      floor_area: AFlo
      volume: VRoo
  ports:
  - flow: undirected
    medium: weather_data
    names:
    - weaBus
    targets:
    - Weather
  - flow: outlet
    medium: data
    names:
    - TAir
    targets:
    - DataBus
  - flow: undirected
    medium: data
    expected_ports: ['latentGains']
    names:
    - intLatGaiFlo
    targets:
    - BaseOccupancy
  - flow: convective
    medium: heat
    names:
    - heaPorAir
    targets:
    - Emission
  - flow: radiative
    medium: heat
    names:
    - heaPorSur
    targets:
    - Emission
  - flow: undirected
    medium: data
    expected_ports: ['sensibleGains']
    names:
    - intSenGaiFlo
    targets:
    - BaseOccupancy
  template: |
      Trano.ThermalZones.ISO13790ZoneHVAC {{ element.name }}(
      redeclare package Medium = Medium,
      {{ macros.render_parameters(parameters) | safe }},
      AWal={{ macros.join_list(element.aggregated_envelope.opaque_areas) }},
      nOrientations={{ element.aggregated_envelope.orientations | length }},
      surAzi={{ macros.join_list(element.aggregated_envelope.azimuths) }},
      surTil={{ macros.join_list(element.aggregated_envelope.tilts) }},
      UWal={{ element.aggregated_envelope.exterior_walls.u_value }},

      AWin={{ macros.join_list(element.aggregated_envelope.window_areas) }},
      UWin={{ element.aggregated_envelope.windows.u_value }},
      UFlo={{ element.aggregated_envelope.floor_u_value(element.parameters.floor_area) }},
      airRat=0.5,
      ARoo={{ element.aggregated_envelope.roof.area }},
      URoo={{ element.aggregated_envelope.roof.u_value }},

      redeclare replaceable Buildings.ThermalZones.ISO13790.Data.Light buiMas,
      gFac={{ element.aggregated_envelope.windows.g_value }}) "Thermal zone"
  variant: default
