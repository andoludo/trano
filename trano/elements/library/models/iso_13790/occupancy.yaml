# Sensible and latent occupancy gains per floor area; the ISO 13790 zone multiplies them by its floor area.
- classes:
  - Occupancy
  figures: []
  library: iso_13790
  parameter_processing:
    function: default_parameters
  ports:
  - flow: undirected
    medium: data
    expected_ports: ['intLatGaiFlo']
    names:
    - latentGains
    targets:
    - Space
  - flow: undirected
    medium: data
    expected_ports: ['intSenGaiFlo']
    names:
    - sensibleGains
    targets:
    - Space
  template: |2-

        {{package_name}}.Trano.Occupancy.ISO13790
        {{ element.name }}({{ macros.render_parameters(parameters) | safe}})
  variant: default
