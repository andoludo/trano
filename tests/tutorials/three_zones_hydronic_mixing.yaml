default: !include_default
material:
  - id: MATERIAL:001  # facing brick
    thermal_conductivity: 0.6
    density: 1800.0
    specific_heat_capacity: 840.0
  - id: MATERIAL:002  # mineral wool
    thermal_conductivity: 0.035
    density: 30.0
    specific_heat_capacity: 1030.0
  - id: MATERIAL:003  # gypsum plaster
    thermal_conductivity: 0.5
    density: 1300.0
    specific_heat_capacity: 1000.0

constructions:
  - id: CONSTRUCTION:001
    layers:
      - material: MATERIAL:001
        thickness: 0.1
      - material: MATERIAL:002
        thickness: 0.1
      - material: MATERIAL:003
        thickness: 0.015
spaces:
  - occupancy:
    parameters:
      floor_area: 49.0
      average_room_height: 2.5
    id: SPACE:001
    external_boundaries:
      external_walls:
        - surface: 20
          azimuth: 0
          tilt: wall
          construction: CAVITYWALL:001
        - surface: 30
          azimuth: 1.57
          tilt: wall
          construction: CAVITYWALL:001
        - surface: 50
          azimuth: 3.14
          tilt: wall
          construction: CAVITYWALL:001
      windows:
        - surface: 5.0
          construction: EPCDOUBLE:001
          azimuth: 0
          tilt: wall
        - surface: 2.0
          construction: EPCDOUBLE:001
          azimuth: 3.14
          tilt: wall
      floor_on_grounds:
        - surface: 49
          construction: CONCRETESLAB:001
    emissions:
      - radiator:
          parameters:
            nominal_heating_power_positive_for_heating: 5000
            dp_nominal: 100
          id: RADIATOR:003
      - valve:
          id: VALVE:003
          control:
            emission_control:
  - occupancy:
      parameters:
        gain: "[ 45; 90; 40 ]"
        occupancy: 3600*{16, 21}
    parameters:
      floor_area: 40
      average_room_height: 2.5
    id: SPACE:002
    external_boundaries:
      external_walls:
        - surface: 25
          azimuth: 0
          tilt: wall
          construction: CAVITYWALLPARTIALFILL:001
        - surface: 25
          azimuth: 1.57
          tilt: wall
          construction: CAVITYWALLPARTIALFILL:001
        - surface: 34
          azimuth: 3.14
          tilt: wall
          construction: CAVITYWALLPARTIALFILL:001
      windows:
        - surface: 5.0
          construction: INS2AR2020:001
          azimuth: 0
          tilt: wall
        - surface: 2.0
          construction: INS2AR2020:001
          azimuth: 3.14
          tilt: wall
      floor_on_grounds:
        - surface: 40
          construction: CONCRETESLAB:001
    emissions:
      - radiator:
          parameters:
            nominal_heating_power_positive_for_heating: 4000
          id: RADIATOR:001
      - valve:
          id: VALVE:001
          control:
            emission_control:
  - occupancy:
      parameters:
        gain: "[35; 70; 30]"
        occupancy: 3600*{10, 14}
    parameters:
      floor_area: 50.0
      average_room_height: 2.5
    id: SPACE:003
    external_boundaries:
      external_walls:
        - surface: 22
          azimuth: 3.14
          tilt: wall
          construction: CONSTRUCTION:001
        - surface: 17
          azimuth: 3.14
          tilt: wall
          construction: CONSTRUCTION:001
        - surface: 36
          azimuth: 3.14
          tilt: wall
          construction: CONSTRUCTION:001
      floor_on_grounds:
        - surface: 50.0
          construction: CONCRETESLAB:001
    emissions:
      - radiator:
          parameters:
            nominal_heating_power_positive_for_heating: 4000
          id: RADIATOR:002
      - valve:
          id: VALVE:002
          control:
            emission_control:
internal_walls:
  - space_1: SPACE:001
    space_2: SPACE:002
    construction: CAVITYWALL:001
    surface: 20
  - space_1: SPACE:002
    space_2: SPACE:001
    construction: CONSTRUCTION:001
    surface: 15
  - space_1: SPACE:002
    space_2: SPACE:003
    construction: CAVITYWALLPARTIALFILL:001
    surface: 22
systems:
  # A mixing circuit per group of rooms: boiler -> three-way valve -> temperature sensor -> pump -> radiators.
  # The pump after the valve draws the return water in through port_3 of the valve and mixes it with the
  # boiler water, so the valve holds the temperature sent to the radiators whatever the boiler supply.
  - boiler:
      id: BOILER:001
      parameters:
        nominal_heating_power: 12000
      control:
        boiler_control:
          id: BOILER_CONTROL:001
          parameters:
            tsup_nominal: 353.15  # 80 degC: the top of the storage tank reaches about 95 degC
      outlets:
        - THREE_WAY_VALVE:001
        - THREE_WAY_VALVE:002
  - three_way_valve:
      id: THREE_WAY_VALVE:001
      control:
        three_way_valve_control:
          id: THREE_WAY_VALVE_CONTROL:001
          parameters:
            supply_temperature_setpoint: 343.15  # 70 degC to the radiators
            # a PI controller tuned for a valve: the default proportional controller (gain 1 per kelvin) moves
            # the valve over its whole stroke for 1 K, hunts around the set point and slows the simulation down
            controller_type: Buildings.Controls.OBC.CDL.Types.SimpleController.PI
            k: 0.1
            ti: 300
      inlets:
        - SPLIT_VALVE:001  # the return water mixed in through port_3
      outlets:
        - TEMPERATURE_SENSOR:001
  - temperature_sensor:
      id: TEMPERATURE_SENSOR:001
      outlets:
        - PUMP:001
  - pump:
      id: PUMP:001
      control:
        collector_control:
      outlets:
        - RADIATOR:001
        - RADIATOR:003
  - split_valve:
      id: SPLIT_VALVE:001
      inlets:
        - VALVE:001
        - VALVE:003
      outlets:
        - BOILER:001
  - three_way_valve:
      id: THREE_WAY_VALVE:002
      control:
        three_way_valve_control:
          id: THREE_WAY_VALVE_CONTROL:002
          parameters:
            supply_temperature_setpoint: 343.15
            controller_type: Buildings.Controls.OBC.CDL.Types.SimpleController.PI
            k: 0.1
            ti: 300
      inlets:
        - SPLIT_VALVE:002
      outlets:
        - TEMPERATURE_SENSOR:002
  - temperature_sensor:
      id: TEMPERATURE_SENSOR:002
      outlets:
        - PUMP:002
  - pump:
      id: PUMP:002
      control:
        collector_control:
      outlets:
        - RADIATOR:002
  - split_valve:
      id: SPLIT_VALVE:002
      inlets:
        - VALVE:002
      outlets:
        - BOILER:001
