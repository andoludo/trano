  - {kpi: vent_supply_mean_c, min: 14, max: 20, why: "at -1 degC outdoor and 21 degC inside, 0.8 recovery gives 16.6 degC: the unit blows air a few kelvin below the room"}
  - {kpi: vent_sfp_w_per_m3s, min: 400, max: 2000, why: "two fans at 200 Pa with the efficiency of the preconfigured movers: 0.4 to 2 kW per m3/s, the range of real units (0.3 to 0.5 W per m3/h)"}
