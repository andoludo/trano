# Gas boilers: BoilerPolynomial of Buildings, efficiency 0.9 on the lower heating value unless the curve says
# otherwise; the fuel record NaturalGasLowerHeatingValue gives 50 MJ/kg at 0.84 kg/m3, 11.67 kWh/m3.
boiler_storage_winter:
  - {kpi: boiler_efficiency, min: 0.80, max: 0.91, why: "0.9 of the curve minus the standing losses of the boiler (counted twice by Buildings 13) and of the 200 l tank"}
  - {kpi: boiler_kwh_per_m3, min: 11.6, max: 11.75, why: "the fuel volume follows the heating value of the fuel record, 11.67 kWh/m3", libraries: [Buildings, IDEAS]}
  - {kpi: boiler_water_max_c, max: 95, why: "the tank control stops the boiler when the tank bottom passes the set point plus 5 K; the boiler water stays below boiling"}
  - {kpi: tank_top_max_c, min: 70, max: 92, why: "the tank top passes the 70 degC set point while the bottom catches up", libraries: [Buildings, IDEAS]}
  - {kpi: boiler_starts_per_day, min: 1, max: 40, why: "a 200 l tank on a 6 kW boiler: a charge every hour or two under load"}
  - {kpi: boiler_heat_kwh, min: 80, max: 250, why: "the load of the zone in the coldest week with the tank losses"}
  - {kpi: zone_mean_occupied_c, min: 19.5, max: 22.5, why: "the zone is held at its set point apart from the morning recovery"}
boiler_no_storage_winter:
  - {kpi: boiler_efficiency, min: 0.84, max: 0.91, why: "0.9 of the curve minus the standing loss of the boiler (1 % at the double-counted UA of Buildings 13), no tank"}
  - {kpi: boiler_kwh_per_m3, min: 11.6, max: 11.75, why: "the heating value of the fuel record", libraries: [Buildings, IDEAS]}
  - {kpi: boiler_water_max_c, max: 85, why: "a proportional controller holds the boiler water at the 70 degC set point with a small overshoot"}
  - {kpi: boiler_heat_kwh, min: 80, max: 250, why: "the load of the zone in the coldest week"}
  - {kpi: zone_mean_occupied_c, min: 19.5, max: 22.5, why: "the zone is held at its set point apart from the morning recovery"}
boiler_condensing_winter:
  - {kpi: boiler_eta_firing, min: 0.93, max: 0.99, why: "the curve gives 0.97 at 40 degC and 0.95 at 50 degC: the boiler feeds 45/35 radiators", libraries: [Buildings, IDEAS]}
  - {kpi: boiler_efficiency, min: 0.90, max: 0.99, why: "the condensing curve minus the standing loss"}
  - {kpi: boiler_water_max_c, max: 60, why: "the set point is 45 degC"}
  - {kpi: zone_mean_occupied_c, min: 19.5, max: 22.5, why: "the zone is held at its set point apart from the morning recovery"}
boiler_storage_shoulder:
  - {kpi: boiler_efficiency, min: 0.70, max: 0.91, why: "part load: the tank losses weigh more against a smaller heat demand"}
  - {kpi: boiler_starts_per_day, max: 40, why: "the tank buffers the part load"}
  - {kpi: zone_mean_occupied_c, min: 20, max: 23.5, why: "the zone is held at its set point, solar gains may push it above"}
boiler_storage_summer:
  - {kpi: boiler_fuel_kwh, max: 45, why: "no heat demand, yet the default control charges the tank whenever the outdoor air drops below its 15 degC cut-off, which July nights in Uccle do: the standing losses of a tank kept at 75 to 85 degC, about 200 W (FastSmoothBuildings has no tank: its boiler idles at its set point)"}
  - {kpi: boiler_heat_kwh, max: 40, why: "the heat only replaces the losses of the tank and of the boiler"}
  - {kpi: zone_min_c, min: 18, why: "the zone floats above the set points in July"}

# Radiator valves (Buildings TwoWayEqualPercentage, 10 kPa valve, 5 kPa fixed) under the emission controls, on the
# boiler with storage at 70 degC, the coldest week.
valve_p:
  - {kpi: zone_tracking_rmse_k, max: 1.5, why: "a proportional band of 1 K (gain 5 on a 0 to 1 opening is 0.2 K per 100 %) and the morning recovery"}
  - {kpi: valve_movements_per_day, max: 60, why: "a proportional controller follows the load without hunting"}
  - {kpi: valve_hours_closed, min: 20, why: "the valve closes at night when the set point falls back to 16 degC"}
  - {kpi: pump_hours_without_demand, max: 1, why: "the collector control stops the pump when the valve is closed"}
  - {kpi: mixing_error_k, max: 3, why: "the PI of the mixing valve holds the 70 degC supply within a few kelvin while the pump runs"}
  - {kpi: zone_mean_occupied_c, min: 19.5, max: 22.5, why: "the zone is held at its set point apart from the morning recovery"}
valve_pi:
  - {kpi: zone_tracking_rmse_k, max: 1.5, why: "the Guideline 36 heating loop holds the set point without steady error"}
  - {kpi: valve_movements_per_day, max: 80, why: "the integral action may hunt slightly"}
  - {kpi: pump_hours_without_demand, max: 1, why: "the collector control stops the pump when the valve is closed"}
  - {kpi: zone_mean_occupied_c, min: 19.5, max: 22.5, why: "the zone is held at its set point apart from the morning recovery"}
valve_onoff:
  - {kpi: zone_tracking_rmse_k, max: 1.5, why: "an on-off controller swings around the set point within its band"}
  - {kpi: valve_hours_open, min: 10, why: "the valve is either fully open or closed"}
  - {kpi: pump_hours_without_demand, max: 1, why: "the collector control stops the pump when the valve is closed"}
  - {kpi: zone_mean_occupied_c, min: 19.5, max: 22.5, why: "the zone is held at its set point apart from the morning recovery"}
valve_nonlinear:
  - {kpi: zone_tracking_rmse_k, max: 1.5, why: "the flow law of the valve does not change what the controller achieves"}
  - {kpi: zone_mean_occupied_c, min: 19.5, max: 22.5, why: "the zone is held at its set point apart from the morning recovery"}

# Ventilation: 150 m3/h (0.05 kg/s) through a 100 m2 zone held at 21 degC by an ideal heater.
