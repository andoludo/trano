# Houses: the six-zone test house (design heat loss about 2.6 kW at -8 degC) for a fortnight from the coldest day.
# The zone KPIs are those of the first room of the file (bedroom 1, heated to 21 degC from 14 to 23 h).
house_air_water_heat_pump:
  - {kpi: hp_scop, min: 2.4, max: 3.8, why: "the air-water heat pump on 45/35 radiators along its heating curve in the coldest fortnight"}
  - {kpi: hp_cop_ratio, min: 0.85, max: 1.1, why: "COP while running against the table at the measured conditions"}
  - {kpi: hp_shortest_run_min, min: 5, why: "the minimum on time of the safety control", libraries: [Buildings, IDEAS]}
  - {kpi: hp_heat_kwh, min: 150, max: 700, why: "a 2.6 kW design loss house with heat recovery ventilation over two cold weeks"}
  - {kpi: vent_effectiveness_measured, min: 0.74, max: 0.92, why: "the 0.8 recovery plus the heat of the fans, measured against the mean of six rooms whose bedrooms, cooler than the living rooms, feed most of the extract"}
  - {kpi: vent_flow_kg_s, min: 0.075, max: 0.09, why: "0.1 kg/s by day and 0.05 kg/s at night: 0.083 kg/s on average"}
  - {kpi: zone_mean_occupied_c, min: 18.5, max: 23, why: "bedroom 1 is heated to 21 degC in the afternoon and evening only; the occupied hours of the KPI (7 to 22 h) include its morning setback"}
house_ground_source_heat_pump:
  - {kpi: hp_scop, min: 2.8, max: 4.6, why: "0.45 of the Carnot COP on a 7 to 8 degC ground loop, more along the heating curve"}
  - {kpi: hp_source_running_c, min: 6.5, max: 8.5, why: "the ground loop at 10 degC mean, near its coldest in late January"}
  - {kpi: hp_heat_kwh, min: 150, max: 700, why: "the load of house_air_water_heat_pump"}
  - {kpi: vent_effectiveness_measured, min: 0.74, max: 0.92, why: "the 0.8 recovery plus the heat of the fans, measured against the mean of six rooms whose bedrooms, cooler than the living rooms, feed most of the extract"}
